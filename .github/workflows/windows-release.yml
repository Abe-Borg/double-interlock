name: Windows installer

on:
  push:
    branches: ['main', 'work/windows-installer']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build game and verify release versions
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match app version' }
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"$'
          if ($cargo.Matches[0].Groups[1].Value -ne $version) { throw 'Cargo version does not match app version' }
      - name: Test simulation and campaign
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath engine-tests.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content engine-tests.log | Where-Object { $_ -match '^FAIL|FAILED|Error|error|Assertion' } | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $LASTEXITCODE
          }
      - run: npx playwright install chromium
      - run: npm run test:desktop
      - name: Prepare screenshot directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force /tmp | Out-Null
      - run: npm run test:ui
      - name: Test native commands
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --target x86_64-pc-windows-msvc
      - name: Build Windows installer
        run: npm run desktop:build -- --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Package release assets
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Smoke-test installed app
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/release/*-setup.exe).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'DoubleInterlockSmoke'
          $setup = Start-Process $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed: $($setup.ExitCode)" }
          $exe = Join-Path $installDir 'double-interlock.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) { throw "Installed app exited: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        with:
          name: Double-Interlock-windows-x64
          path: dist/release/*
          if-no-files-found: error
      - name: Publish release with installer and checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/release/* --verify-tag --title "Double Interlock $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
