[package]
name = "double-interlock"
version = "1.0.0"
description = "A fire protection sim for hyperscale data centers"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
semver = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
