<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Interlock</title>
<style>
:root { --bg:#0a0f14; --pan:#111922; --pan2:#16212c; --line:#243342; --ink:#d7e2ea; --dim:#7f93a3; --red:#ff4b3a; --amb:#ffb224; --yel:#ffe45c; --grn:#3ddc91; --wat:#3aa6ff; --air:#e9d8a0; --n2:#6fe3c6; --mono:'Cascadia Mono','Consolas','SF Mono',Menlo,monospace; --ui:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font:13px/1.4 var(--ui); user-select:none; }
#cv { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
button { font:inherit; color:var(--ink); background:var(--pan2); border:1px solid var(--line); border-radius:4px; padding:4px 9px; cursor:pointer; }
button:hover { border-color:#4b6377; background:#1c2a37; }
button:disabled { opacity:.4; cursor:default; }
button.on { background:#20405a; border-color:var(--wat); color:#fff; }
button.hot { background:#3a1612; border-color:var(--red); color:#ffd9d3; font-weight:600; }
button.go { background:#12382a; border-color:var(--grn); color:#d9ffee; font-weight:600; }
button.pill { border-radius:12px; padding:3px 10px; }
#top { position:fixed; top:0; left:0; right:0; height:42px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 10px; background:linear-gradient(#121b25,#0e151d); border-bottom:1px solid var(--line); z-index:5; }
#top > div { display:flex; align-items:center; gap:6px; white-space:nowrap; }
#scName { font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:12px; }
#scName small { display:block; font-weight:400; letter-spacing:.02em; text-transform:none; color:var(--dim); font-size:11px; margin-top:-2px; }
#clock { font:600 15px var(--mono); min-width:112px; text-align:right; color:#fff; }
#wx { font:12px var(--mono); color:var(--dim); margin-left:8px; }
#money { font:600 15px var(--mono); color:var(--grn); margin-right:6px; }
#money.neg { color:var(--red); }
.sp { padding:3px 7px; font:12px var(--mono); }
#ann { position:fixed; left:10px; top:52px; width:292px; max-height:calc(100% - 190px); display:flex; flex-direction:column; background:rgba(13,20,27,.94); border:1px solid var(--line); border-radius:6px; z-index:4; overflow:hidden; }
#ann .hd { font:700 10.5px var(--mono); letter-spacing:.12em; padding:6px 8px; background:#0c1218; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
#ann .hd2 { font:700 10px var(--mono); letter-spacing:.12em; color:var(--dim); padding:4px 8px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
#annState { color:var(--grn); }
#annState.al { color:var(--red); animation:blink .6s steps(2) infinite; } #annState.sv { color:var(--amb); } #annState.tr { color:var(--yel); }
@keyframes blink { 50% { opacity:.25; } }
#sigs { overflow:auto; max-height:230px; }
.sig { display:flex; gap:6px; padding:4px 8px; border-bottom:1px solid #18232e; font:11.5px var(--mono); cursor:pointer; }
.sig b { flex:none; width:46px; } .sig.ALARM b { color:var(--red); } .sig.SUPV b { color:var(--amb); } .sig.TRBL b { color:var(--yel); }
.sig.loc { opacity:.55; } .sig:hover { background:#17222d; }
.sig.OPEN b { color:#c59bff; } .sig.sup { opacity:.5; } .sig.sup b { text-decoration:line-through; }
.sig.stn { background:#1a1a0c; } .sig.stn em { font-style:normal; color:var(--yel); margin-right:4px; }
#annState.op { color:#c59bff; } #annState.sil { animation:none; }
.res .gov { color:#fff; font-weight:700; border-bottom:1px solid var(--amb); }
#log { overflow:auto; flex:1; min-height:60px; max-height:220px; padding:3px 0; font:11px var(--mono); }
#log div { padding:1px 8px; color:var(--dim); } #log .bad { color:#ff9488; } #log .warn { color:#ffcf73; } #log .good { color:#8ff0c1; } #log i { color:#4d6272; font-style:normal; margin-right:5px; }
#side { position:fixed; right:10px; top:52px; width:318px; max-height:calc(100% - 150px); overflow:auto; background:rgba(13,20,27,.95); border:1px solid var(--line); border-radius:6px; z-index:4; padding:0 0 8px; }
#side:empty { display:none; }
#side h3 { margin:0; padding:8px 10px 6px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; background:#0c1218; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
#side h3 small { color:var(--dim); font-weight:400; text-transform:none; letter-spacing:0; }
#side p { margin:7px 10px; color:#a9bac7; font-size:12px; }
#side .row { display:flex; justify-content:space-between; gap:8px; padding:2px 10px; font-size:12px; } #side .row b { font:600 12px var(--mono); color:#fff; text-align:right; }
#side .row b.bad { color:var(--red); } #side .row b.good { color:var(--grn); } #side .row b.warn { color:var(--amb); }
#side .btns { display:flex; flex-wrap:wrap; gap:5px; padding:6px 10px 2px; } #side .btns button { font-size:12px; padding:3px 8px; }
#side .sec { margin:8px 0 2px; padding:3px 10px; font:700 10px var(--mono); letter-spacing:.12em; color:var(--dim); border-top:1px solid var(--line); }
#side canvas { display:block; margin:6px auto 0; }
#side .res { margin:6px 10px; padding:6px 8px; border-left:3px solid var(--line); background:#0f1820; font:11.5px var(--mono); color:#b9c8d3; } .res.pass { border-color:var(--grn); } .res.fail { border-color:var(--red); } .res.warn { border-color:var(--amb); } .stqFoot { margin:4px 10px 6px; font:10.5px var(--mono); color:var(--dim); } .res b { display:block; color:#fff; margin-bottom:2px; }
.stp { display:inline-flex; align-items:center; gap:3px; } .stp button { padding:0 6px; font:12px var(--mono); line-height:18px; }
#tools { position:fixed; left:8px; right:8px; bottom:8px; margin:0 auto; width:fit-content; display:flex; flex-direction:column; gap:5px; padding:6px 9px 7px; background:rgba(13,20,27,.96); border:1px solid var(--line); border-radius:8px; z-index:4; max-width:calc(100% - 16px); }
#tools .rowg { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; row-gap:6px; }
#tools .grp { display:flex; flex-direction:column; gap:3px; padding-right:10px; border-right:1px solid var(--line); } #tools .grp:last-child { border:0; padding-right:0; }
#tools .grp > span { font:700 9px var(--mono); letter-spacing:.12em; color:var(--dim); }
#tools .bs { display:flex; gap:4px; }
.tb { width:52px; height:50px; padding:2px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:1px; font-size:9.5px; line-height:1.05; position:relative; color:#b8c7d2; white-space:nowrap; overflow:hidden; }
.tb canvas { width:28px; height:28px; flex:none; } .tb kbd { position:absolute; top:1px; left:3px; font:9px var(--mono); color:var(--dim); } .tb.on { box-shadow:0 0 0 1px var(--wat) inset; }
.tb.sz { width:34px; height:24px; justify-content:center; font:11px var(--mono); } .szs { display:grid; grid-template-columns:repeat(6,34px); gap:2px; }
#hint { font-size:12px; color:#c6d4de; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; min-height:17px; }
#banner { position:fixed; left:50%; top:56px; transform:translateX(-50%); max-width:560px; padding:9px 16px; background:rgba(60,14,10,.95); border:1px solid var(--red); border-radius:6px; font-size:14px; font-weight:600; color:#ffe2dd; z-index:6; opacity:0; transition:opacity .4s; pointer-events:none; text-align:center; }
#banner.show { opacity:1; pointer-events:auto; cursor:pointer; }
#tip { position:fixed; padding:5px 8px; background:#0b1117; border:1px solid var(--line); border-radius:4px; font:11.5px var(--mono); color:#cfe0ea; z-index:7; pointer-events:none; display:none; white-space:pre; }
#pop { position:fixed; z-index:8; display:none; background:#0f1820; border:1px solid var(--line); border-radius:6px; padding:5px; min-width:170px; }
#pop button { display:block; width:100%; text-align:left; margin:2px 0; border:0; background:none; } #pop button:hover { background:#1c2a37; }
#modal { position:fixed; inset:0; background:rgba(4,7,10,.74); z-index:20; display:none; align-items:center; justify-content:center; }
#modal.show { display:flex; }
#mbox { width:min(860px,94vw); max-height:90vh; overflow:auto; background:var(--pan); border:1px solid #2f4254; border-radius:8px; padding:22px 26px; box-shadow:0 20px 80px #000; user-select:text; }
#mbox h1 { margin:0 0 2px; font-size:30px; letter-spacing:.22em; font-weight:800; } #mbox h1 span { color:var(--red); }
#mbox h2 { margin:0 0 4px; font-size:19px; letter-spacing:.08em; text-transform:uppercase; } #mbox h4 { margin:14px 0 4px; font:700 11px var(--mono); letter-spacing:.14em; color:var(--dim); }
#mbox p { color:#b6c6d2; margin:8px 0; font-size:14px; line-height:1.55; } #mbox li { color:#b6c6d2; margin:3px 0; font-size:13.5px; }
#mbox .sub { color:var(--dim); font:12px var(--mono); letter-spacing:.08em; margin-bottom:12px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; margin-top:12px; }
.card { text-align:left; padding:11px 12px; border-radius:6px; background:var(--pan2); border:1px solid var(--line); } .card b { display:block; font-size:14px; letter-spacing:.05em; text-transform:uppercase; } .card small { color:var(--dim); display:block; margin-top:2px; } .card i { float:right; font-style:normal; color:var(--amb); letter-spacing:2px; }
.card.lock { opacity:.42; } .card em { font:700 10px var(--mono); color:var(--dim); font-style:normal; letter-spacing:.12em; }
.goal { display:flex; gap:8px; padding:6px 0; border-bottom:1px solid #1b2733; font-size:13.5px; } .goal i { flex:none; width:18px; font-style:normal; color:var(--dim); } .goal.ok i { color:var(--grn); } .goal.ok { color:#9fb3c1; } .goal small { display:block; color:var(--dim); margin-top:2px; }
.find { padding:6px 8px; margin:5px 0; border-left:3px solid var(--amb); background:#0f1820; cursor:pointer; font-size:13px; } .find.fail { border-color:var(--red); } .find.ok { border-color:var(--grn); } .find.info { border-color:var(--wat); } .find small { display:block; color:var(--dim); font:11px var(--mono); margin-top:2px; }
.mrow { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; align-items:center; } .mrow button { padding:7px 16px; font-size:14px; }
.man { display:grid; grid-template-columns:190px 1fr; gap:18px; } .man nav button { display:block; width:100%; text-align:left; margin-bottom:3px; border:0; background:none; color:#a9bac7; } .man nav button.on { background:#1c2a37; color:#fff; }
.man table { border-collapse:collapse; margin:8px 0; font-size:13px; } .man td, .man th { border:1px solid var(--line); padding:4px 8px; text-align:left; color:#b6c6d2; } .man th { color:#fff; background:#0f1820; }
.stars { font-size:34px; letter-spacing:6px; color:var(--amb); } .stars s { color:#2c3b49; text-decoration:none; }
#imp:empty { display:none; } #imp { border-bottom:1px solid var(--line); background:#1d1608; }
#imp .hd3 { font:700 10px var(--mono); letter-spacing:.12em; color:var(--amb); padding:4px 8px 2px; }
#imp .imp { padding:2px 8px 5px; font:11.5px var(--mono); color:#ffd590; cursor:pointer; } #imp .imp:hover { background:#2a1f0a; }
#side p.imp { margin:6px 10px 2px; padding:4px 8px; border-left:3px solid var(--amb); background:#1d1608; color:#ffd590; font:11.5px var(--mono); }
#stq:empty { display:none; } #stq { border-top:1px solid var(--line); background:#101a12; max-height:150px; overflow:auto; flex:none; }
#stq .hd3 { font:700 10px var(--mono); letter-spacing:.12em; color:var(--yel); padding:4px 8px 2px; }
#stq .stq { padding:2px 8px 4px; font:11px var(--mono); color:#cfe0c8; cursor:pointer; border-bottom:1px solid #18232e; } #stq .stq:hover { background:#17222d; }
#stq .stq b { color:var(--yel); margin-right:4px; } #stq .stq.SENT b { color:var(--grn); } #stq .stq.DROPPED b { color:var(--red); } #stq .stq.SENT { opacity:.75; }
#stq .stq.haz { border-left:3px solid var(--red); } #stq .stq small { display:block; margin-top:2px; color:#e9b9b2; font:10.5px var(--mono); white-space:normal; }
#mbox.wide { width:min(1280px,96vw); } #mbox p.impTag { border-left:3px solid var(--amb); padding-left:10px; color:#ffd590; }
.ce { border-collapse:collapse; width:100%; margin:10px 0; font:11.5px/1.35 var(--mono); } .ce th, .ce td { border:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; color:#b6c6d2; } .ce th { color:#fff; background:#0f1820; position:sticky; top:-22px; }
.ce tr.off td { color:#566878; } .ce tr.live td { background:#2a1d0c; color:#ffe2b0; } .ce .now { display:block; color:var(--amb); font-weight:700; letter-spacing:.06em; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <div class="tl"><button id="bMenu" title="Contracts">&#9776;</button><div id="scName"></div><button id="bGoals" class="pill">Goals <span id="goalN"></span></button></div>
  <div class="tc">
    <div id="clock">00:00:00</div>
    <button class="sp" data-sp="0" title="Pause (Space)">&#10073;&#10073;</button><button class="sp on" data-sp="1">1&times;</button><button class="sp" data-sp="4">4&times;</button><button class="sp" data-sp="20">20&times;</button><button class="sp" data-sp="120">120&times;</button>
    <button id="bSkip" title="Skip ahead">Skip &#9662;</button>
    <div id="wx"></div>
  </div>
  <div class="tr"><div id="money"></div><button id="bSite" title="Site settings: enforced edition, pipe size cut, water delivery, detection thresholds, signal classes, company rules. Read-only in a contract">Site</button><button id="bReview">Review</button><button id="bTests">Tests</button><button id="bInc">Incident</button><button id="bDrill" class="hot">Run drill</button><button id="bManual" title="Field manual (M)">Manual</button><button id="bSnd" title="Sound">&#9835;</button></div>
</div>
<div id="ann"><div class="hd">FIRE ALARM ANNUNCIATOR <span id="annState">NORMAL</span></div><div id="imp"></div><div id="sigs"></div><div id="stq"></div><div class="hd2">EVENT LOG</div><div id="log"></div></div>
<div id="side"></div>
<div id="tools"></div>
<div id="banner"></div>
<div id="tip"></div>
<div id="pop"></div>
<div id="modal"><div id="mbox"></div></div>
<script>
// DOUBLE INTERLOCK - core namespace, constants, helpers.
// Units everywhere: psi (gauge), gpm, gallons, feet, seconds. One map tile = 10 ft.
var DI = globalThis.DI || (globalThis.DI = {});

DI.TILE_FT = 10;
DI.ATM = 14.7;            // psia
DI.PSI_FT = 0.433;        // psi per ft of water column
DI.DX = [0, 1, 0, -1];    // dir 0=N 1=E 2=S 3=W
DI.DY = [-1, 0, 1, 0];
DI.OPP = [2, 3, 0, 1];

DI.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
DI.lerp = (a, b, t) => a + (b - a) * t;
DI.fmt = (v, d = 0) => (isFinite(v) ? v.toFixed(d) : '--');
DI.money = (v) => (v < 0 ? '-$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US');
DI.clock = (s) => {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  const p = (n) => String(n).padStart(2, '0');
  return (d ? 'D' + (d + 1) + ' ' : '') + p(h) + ':' + p(m) + ':' + p(x);
};
DI.dur = (s) => (s < 90 ? DI.fmt(s, s < 10 ? 1 : 0) + ' s' : s < 5400 ? DI.fmt(s / 60, 1) + ' min' : DI.fmt(s / 3600, 1) + ' h');

DI.rng = function (seed) {           // mulberry32
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

// tiny event bus
DI.bus = {
  h: {},
  on(ev, fn) { (this.h[ev] || (this.h[ev] = [])).push(fn); },
  emit(ev, a, b, c) { const l = this.h[ev]; if (l) for (let i = 0; i < l.length; i++) l[i](a, b, c); },
};

// Pipe table, split by schedule. id40 / id10 = inside diameter (in) of Schedule 40 / Schedule 10 steel pipe
// (steel pipe dimensions table in the NFPA 13 annex / ASME B36.10M), cost = $ per 10-ft tile installed.
// ASSUMED: cost is the same for both schedules of a size.
// 12 in. Sch 10 is OD 12.750, wall 0.180, ID 12.390 (FP Lead): above-ground headers only. Underground and
// yard pipe would be its own material (ductile iron, PVC / HDPE), still C = 100, and is not modelled.
DI.PIPES = [
  { n: '1"', id40: 1.049, id10: 1.097, cost: 90 },
  { n: '1¼"', id40: 1.38, id10: 1.442, cost: 110 },
  { n: '1½"', id40: 1.61, id10: 1.682, cost: 130 },
  { n: '2"', id40: 2.067, id10: 2.157, cost: 170 },
  { n: '2½"', id40: 2.469, id10: 2.635, cost: 230 },
  { n: '3"', id40: 3.068, id10: 3.26, cost: 290 },
  { n: '4"', id40: 4.026, id10: 4.26, cost: 400 },
  { n: '6"', id40: 6.065, id10: 6.357, cost: 640 },
  { n: '8"', id40: 7.981, id10: 8.249, cost: 900 },
  { n: '10"', id40: 10.02, id10: 10.37, cost: 1250 },
  { n: '12"', id40: 11.938, id10: 12.39, cost: 1600 },
];
// Pipe size cut (project setting W.cfg.pipeCut, ASSUMED default 2 in.): the largest size on threaded Sch 40.
// That size and smaller are threaded Sch 40; every larger size is roll-grooved Sch 10, main or branch alike.
DI.PIPE_CUT_DEFAULT = 3;               // index into DI.PIPES: 2 in.
DI.PIPE_CUTS = [2, 3, 4, 5, 6];        // sizes the Site menu offers as the cut: 1½ in. to 4 in.
DI.PIPES.forEach((p, i) => {
  const mk = (id, sch) => ({ n: p.n, id, gal: 0.0408 * id * id, cost: p.cost, sch });   // gal/ft = 0.0408 d^2
  p.s40 = mk(p.id40, 40); p.s10 = mk(p.id10, 10);
  const d = i <= DI.PIPE_CUT_DEFAULT ? p.s40 : p.s10; p.id = d.id; p.gal = d.gal;       // default-cut values
});
DI.pipeCut = (W) => { const c = W && W.cfg ? W.cfg.pipeCut : undefined; return DI.PIPE_CUTS.includes(c) ? c : DI.PIPE_CUT_DEFAULT; };
// schedule of size index i for a given cut
DI.pipeSch = (cut, i) => (i <= cut ? 40 : 10);
// the pipe on tile k: { n, id, gal, cost, sch }. Every engine and UI reader goes through this.
DI.pipeAt = (W, k) => { const i = W.pd[k] - 1, p = DI.PIPES[i]; return DI.pipeSch(DI.pipeCut(W), i) === 40 ? p.s40 : p.s10; };

// Hazen-Williams: friction loss in psi per foot at 1 gpm (multiply by Q^1.85).
// p = 4.52 Q^1.85 / (C^1.85 d^4.87)   (NFPA 13)
DI.hw = (C, d) => 4.52 / (Math.pow(C, 1.85) * Math.pow(d, 4.87));
// Company rule: C = 100 for all sprinkler pipe: wet, dry, preaction, interior, yard and underground.
// Nitrogen earns no C-factor credit. Any other C shown in the UI is a comparison label only.
DI.HW_C = 100;
DI.pipeC = () => DI.HW_C;

// Hazard table: required density (gpm/ft2), design area (ft2), hose (gpm), duration (min),
// fire growth alpha (kW/s2). Single-point density/area values (NFPA 13 Ch. 19; the enforced edition
// is a site setting, see juris.js).
DI.HAZ = {
  LH: { name: 'Light Hazard', dens: 0.10, area: 1500, hose: 100, dur: 30, alpha: 0.0029, cap: 1500 },
  OH1: { name: 'Ordinary Hazard Group 1', dens: 0.15, area: 1500, hose: 250, dur: 60, alpha: 0.0117, cap: 4000 },
  OH2: { name: 'Ordinary Hazard Group 2', dens: 0.20, area: 1500, hose: 250, dur: 60, alpha: 0.0117, cap: 6000 },
  EH1: { name: 'Extra Hazard Group 1', dens: 0.30, area: 2500, hose: 500, dur: 90, alpha: 0.0469, cap: 12000 },
};

// Room types. val = $ of contents per tile, wetDmg = fraction of val ruined when soaked,
// smokeDmg = sensitivity to smoke, cond = conditioned (heated) space, spotRelease = one listed spot
// smoke detector in alarm is the detection leg of a preaction release (support rooms only; white space
// needs aspirating detection, and the battery room stays alarm-only until the Li-ion cycle).
DI.ROOMS = {
  office: { name: 'Office / Admin', haz: 'LH', val: 6e3, wetDmg: 0.25, smokeDmg: 0.1, cond: true, col: '#263445', ceil: 10 },
  hall: { name: 'Data Hall', haz: 'OH1', val: 9e5, wetDmg: 0.8, smokeDmg: 1.0, cond: true, col: '#1d2f3a', ceil: 16 },
  elec: { name: 'Electrical / UPS Room', haz: 'OH1', val: 4e5, wetDmg: 0.9, smokeDmg: 0.6, cond: true, col: '#2f2a3d', ceil: 14, spotRelease: true },
  batt: { name: 'Battery Room', haz: 'OH2', val: 3e5, wetDmg: 0.5, smokeDmg: 0.5, cond: true, col: '#3a2a2f', ceil: 14 },
  dock: { name: 'Loading Dock', haz: 'OH2', val: 1.5e4, wetDmg: 0.1, smokeDmg: 0.05, cond: false, col: '#2e3328', ceil: 18 },

// Listed sensitivity ranges, %/ft obscuration.
//   smoke: 0.5 to 4.0 is the FA Lead's example window for a spot photoelectric detector (example data, not cited).
DI.LISTED = { smoke: { min: 0.5, max: 4.0 } };
// Aspirating detector: the listing bounds every threshold per stage, per model. The ranges below are read from
// the maker's own datasheets (FA Lead pull, 2026-11-10); the UL Product iQ listing itself was not readable, so
// every range is shown with DI.ASD_SRC. Each range is [min, max] inclusive, in the stage order of DI.detThr
// (Alert, Action, Fire 1, Fire 2). The sheets print setting ranges only, no default thresholds: the example
// defaults (DI.VESDA_T) are owner-set values inside the range, ASSUMED and NEEDS PE REVIEW.
// Recorded, not merged: the 2020 Honeywell VEP sheet (VESDA-E-VEP V.02, 04/20) prints the same metric ranges
// with different imperial figures (0.0016 to 0.625 Alert / Action, 0.0031 to 0.625 Fire 1, 0.0063 to 6.25
// Fire 2). The July 2025 UL 268 7th Ed. sheet governs for the US models.
// Not in the table: FAAST and TITANUS (see README).
// VEA (Cycle 7, FA Lead) is a Fire 1-only model: one stage, picked from three discrete settings.
//   VESDA-E VEA, Fire 1 = 0.5 (High) / 1.23 (Enhanced) / 2.5 (Standard) %/ft (Xtralis Doc. 36348_03) [HB]. The Gamewell
//   sheet 9021-61037 prints Enhanced as 1.3 (4.0 %/m): a source mismatch, shown as a note beside the pick, never a
//   fourth choice and never merged with 1.23. Alert, Action and Fire 2 values are NOT FOUND: the model has no such
//   stage and nothing is printed for them. Default pick (Cycle 8, FA Lead): 0.5 in a telecom room where NFPA 76
//   applies (DI.n76Applies), 1.23 in every other room, whatever the site flag (DI.veaDefault). UL Product iQ stays
//   "not checked".
DI.ASD_SRC = '[HB, datasheet; UL Product iQ not checked]';
DI.ASD_STAGES = [['alert', 'Alert'], ['action', 'Action'], ['fire1', 'Fire 1'], ['fire2', 'Fire 2']];
DI.ASD_MODELS = {
  VEP: { label: 'VESDA-E VEP', models: 'VEP-A00-1P-UL, VEP-A00-P-UL, VEP-A10-P-UL', doc: 'Xtralis Doc. 36106_07, Part AD36106-007, July 2025, p. 2', src: 'xtralis.com/file/12015',
    range: { alert: [0.0015, 0.614], action: [0.0015, 0.614], fire1: [0.0030, 0.614], fire2: [0.0061, 6.575] } },
  VEU: { label: 'VESDA-E VEU', models: 'VEU-A00-UL, VEU-A10-UL', doc: 'Xtralis Doc. 36107_05, Part AD36107-005, November 2024, p. 2', src: 'xtralis.com/file/12017',
    range: { alert: [0.0003, 0.614], action: [0.0003, 0.614], fire1: [0.0003, 0.614], fire2: [0.0003, 6.575] } },
  VEA: { label: 'VESDA-E VEA', models: '', doc: 'Xtralis Doc. 36348_03', src: '', fire1Only: true, pick: [0.5, 1.23, 2.5], pickName: ['High', 'Enhanced', 'Standard'], primary: 1.23, oem: 1.3,
    oemNote: 'Source mismatch: the Gamewell sheet 9021-61037 prints the Enhanced setting as 1.3 %/ft (4.0 %/m). The Xtralis sheet (Doc. 36348_03) prints 1.23 and is the one used; 1.3 is not a setting here. [HB]',
    range: {} },
};
DI.ASD_DEFAULT = 'VEP';
// the source record of the VEA figures, kept for the manual's source note (the model itself is DI.ASD_MODELS.VEA)
DI.ASD_RECORDED = { VEA: { label: 'VESDA-E VEA', doc: 'Xtralis Doc. 36348_03', fire1: [0.5, 1.23, 2.5], primary: 1.23, oem: 1.3,
  note: 'VESDA-E VEA source record: Fire 1 settings 0.5 (High) / 1.23 (Enhanced) / 2.5 (Standard) %/ft (Xtralis Doc. 36348_03, primary). The Gamewell sheet 9021-61037 prints Enhanced as 1.3 (4.0 %/m), a source mismatch kept as a note only. Alert, Action and Fire 2 values are not published in the sheets pulled, so the model is Fire 1 only.' } };
// site setting W.cfg.asdModel: the key if it is in the table, else the default (an old save has no key)
DI.asdModel = (W) => { const k = W && W.cfg ? W.cfg.asdModel : undefined; return typeof k === 'string' && Object.prototype.hasOwnProperty.call(DI.ASD_MODELS, k) ? k : DI.ASD_DEFAULT; };
// the four [min, max] pairs of the site's model, in DI.detThr order (null = no listed range printed for that stage: VEA)
DI.asdRange = (W) => { const r = DI.ASD_MODELS[DI.asdModel(W)].range; return DI.ASD_STAGES.map(([k]) => r[k] || null); };
// VEA: a Fire 1-only detector. Its one threshold is W.cfg.detThr[2] where thresholds are stored, else the default pick.
// A stored value that is not one of the three settings is kept as it is and fails plan review (never clamped).
DI.isVea = (W) => DI.asdModel(W) === 'VEA';
// NFPA 76 applies by room (FA Lead, Cycle 8): only a room of type `tel` (Telecom / MMR) can be an NFPA 76 space, and a
// hall never is. The room's own `n76` (true / false) decides where it is set; absent, the room follows the site
// flag W.cfg.nfpa76Adopted, which is now only the default for telecom rooms. Which rooms count as NFPA 76 telecom
// is a judgment call: PRACTICE, NEEDS PE REVIEW.
DI.n76Applies = (W, room) => !!room && room.type === 'tel' && (room.n76 !== undefined ? room.n76 === true : !!(W && W.cfg && W.cfg.nfpa76Adopted));
DI.VEA_TEL = 0.5;                         // the VEA default in an NFPA 76 telecom room (the High setting)
DI.veaDefault = (W, room) => (DI.n76Applies(W, room) ? DI.VEA_TEL : DI.ASD_MODELS.VEA.primary);
// the site pick: the stored Fire 1 where thresholds are stored, else null
DI.veaSitePick = (W) => { const t = W && W.cfg ? W.cfg.detThr : null; return Array.isArray(t) && t.length === 4 && typeof t[2] === 'number' ? t[2] : null; };
// The Fire 1 a VEA detector in `room` reads: the room's own pick (room.f1, one of the three listed settings), else the
// site pick where one is stored, else the default by room (0.5 in an NFPA 76 telecom room, 1.23 anywhere else). VEA
// only: no other detector model has a per-room threshold. With no room given it is the site value.
DI.veaFire1At = (W, room) => { const s = DI.veaSitePick(W); return room && typeof room.f1 === 'number' ? room.f1 : s !== null ? s : DI.veaDefault(W, room); };
DI.veaFire1 = (W) => DI.veaFire1At(W, null);
// where that number comes from, for the inspector
DI.veaFire1Src = (W, room) => (room && typeof room.f1 === 'number' ? 'room pick' : DI.veaSitePick(W) !== null ? 'site pick' : DI.n76Applies(W, room) ? 'default in an NFPA 76 telecom room' : 'default');
DI.VEA_NA = 'not published for this model';

// Site / project settings with a default (W.cfg, saved with the world). All ASSUMED and tunable.
//   spotThr  spot detector alarm threshold, %/ft (example value)
//   fitPct   fittings allowance on pipe volume, %       trimGal  valve trim volume, gal per system valve
//   insurer  'none' | 'FM' (FM adds the 30 s delivery limit at any volume; NEEDS PE REVIEW)
DI.CFG_DEFAULT = { spotThr: 1.3, fitPct: 5, trimGal: 2, insurer: 'none' };
// Other settings read with a default when absent (an old save loads unchanged): dactHold (DI.dactHold, true), standby
// (DI.standbyKey, 'nfpa5'), panelGen (DI.panelGen, false), refillSeq (DI.refillSeq, gas.js, false).
// Cycle 8: ownerRefill (DI.ownerRefill, none) and nec (DI.nec, '2023').
DI.cfgNum = (W, key, lo) => { const v = W && W.cfg ? W.cfg[key] : undefined; return typeof v === 'number' && isFinite(v) && v >= (lo || 0) ? v : DI.CFG_DEFAULT[key]; };
DI.spotThr = (W) => { const v = DI.cfgNum(W, 'spotThr'); return v > 0 ? v : DI.CFG_DEFAULT.spotThr; };
DI.insurer = (W) => (W && W.cfg && W.cfg.insurer === 'FM' ? 'FM' : 'none');

// Signal classes (W.cfg.sigClass). Alert and Action are pre-alarm: supervisory by default, alarm if the
// engineer elects it. A latched P is a release input whose class has not been elected: OPEN by default,
// ALARM or TRBL if elected, and never SUPV (supervisory is blocked for it). All ASSUMED, NEEDS PE REVIEW.
// Fixed classes, no setting (DI.SIG_FIXED): Fire 1, Fire 2, manual station, Manual Release zone, release circuit,
// waterflow and a spot detector ALARM; low and high air, valve tamper, the optional AVC bypass tamper and a contract impairment SUPV; panel AC, low
// battery, loss of communication, a failed DACT channel, a failed DACT transmission, a charger failure, a
// disconnected battery and loss of supply air TRBL. Loss of supply air is TRBL
// [PRACTICE] (FA Lead, 2026-11-10 3:01 PM PT): a compressor or N2 power or controller fault is equipment trouble,
// its own signal; the pressure drop it causes is still reported by the separate low-air supervisory.
// The fire pump, tank and low-temperature signals keep the classes they always had (PRACTICE, not in the FA Lead's
// table: ASSUMED).
// The registry is the whole list: every signal the game raises has a key here or in DI.SIG_CLASS. DI.inClass is
// the one reader of a class. add(...) in DI.alarmStep takes the registry key, never a class, and the
// cause-and-effect matrix and the signal schedule (cause.js) read the same keys.
DI.SIG_FIXED = { fire1: 'ALARM', fire2: 'ALARM', manual: 'ALARM', mrz: 'ALARM', release: 'ALARM', waterflow: 'ALARM', lowAir: 'SUPV', highAir: 'SUPV', tamper: 'SUPV', avcTamper: 'SUPV',
  supplyAir: 'TRBL', acFail: 'TRBL', lowBatt: 'TRBL', lostComm: 'TRBL', impair: 'SUPV', dactFail: 'TRBL', chgFail: 'TRBL', battDisc: 'TRBL',
  spot: 'ALARM', pumpRun: 'SUPV', pumpMode: 'SUPV', pumpPower: 'SUPV', pumpFail: 'TRBL', pumpFuel: 'SUPV', pumpBatt: 'TRBL', tankLow: 'SUPV', lowTemp: 'SUPV', dactChan: 'TRBL' };
// Fire-department dispatch (FA Lead signal schedule). Alarm signals go to the fire department [CODE, section not
// pulled]: the keys below. Everything else goes to the supervising station only [PRACTICE]: every supervisory and
// trouble signal, the pre-alarm stages (Alert, Action) and a latched P even where the owner elects them ALARM, and
// the release circuit, which is an output of the panel and not an input.
DI.SIG_FD = { fire1: 1, fire2: 1, manual: 1, mrz: 1, waterflow: 1, spot: 1 };
DI.SIG_CLASS = { alert: ['SUPV', 'ALARM'], action: ['SUPV', 'ALARM'], pLatch: ['OPEN', 'ALARM', 'TRBL'] };
DI.SIG_DEFAULT = { alert: 'SUPV', action: 'SUPV', pLatch: 'OPEN' };
DI.sigClass = (W, key) => { const c = W && W.cfg && W.cfg.sigClass, v = c ? c[key] : undefined; return DI.SIG_CLASS[key].includes(v) ? v : DI.SIG_DEFAULT[key]; };
DI.inClass = (W, key) => (Object.prototype.hasOwnProperty.call(DI.SIG_CLASS, key) ? DI.sigClass(W, key) : DI.SIG_FIXED[key]);
DI.AVC_TAMPER_TAG = 'PRACTICE (no code requirement verified for the air bypass)';
// The signal schedule (DI.signalSchedule, cause.js): label and tag of every registry key, in the FA Lead's table
// order (the first thirteen), then the keys the Lead's table does not list. The tag is the Lead's wording where
// the table has the row; the rest are marked as ours.
(function () {
  const stn = 'station only [PRACTICE]', ours = 'PRACTICE / not in FA Lead table (ASSUMED)';
  DI.SIG_META = {
    fire1: { label: 'Fire 1 (detection, D)', tag: '[CODE, alarm signals go to the communications center; section not pulled]' },
    fire2: { label: 'Fire 2 (escalation)', tag: '[CODE, alarm signals go to the communications center; section not pulled]' },
    manual: { label: 'Manual station (typed DETECTION)', tag: '[CODE, alarm signals go to the communications center; section not pulled]' },
    waterflow: { label: 'Waterflow', tag: '[CODE, alarm signals go to the communications center; section not pulled]' },
    tamper: { label: 'Control valve tamper', tag: 'Class [CODE]; ' + stn },
    lowAir: { label: 'Low air', tag: 'Class [CODE], section not pulled; ' + stn },
    highAir: { label: 'High air', tag: 'Class [CODE], section not pulled; ' + stn },
    supplyAir: { label: 'Loss of supply air (compressor / N2 source)', tag: '[PRACTICE, per FP Lead’s call]' },
    lowBatt: { label: 'Panel low battery', tag: 'Class [PRACTICE]; no voltage threshold in held Ch.10; ' + stn },
    acFail: { label: 'Panel AC failure', tag: 'Class [CODE 10.6.9.1.1]; ' + stn },
    alert: { label: 'Aspirating Alert (pre-alarm)', tag: '[OWNER]' },
    action: { label: 'Aspirating Action (pre-alarm)', tag: '[OWNER]' },
    pLatch: { label: 'P latched (release input)', tag: 'Class OPEN (R04, R17)' },
    mrz: { label: 'Manual Release zone (9(c) bypass)', tag: ours },
    spot: { label: 'Spot smoke detector', tag: ours },
    release: { label: 'Release circuit active (a panel output)', tag: ours },
    impair: { label: 'Impairment: Manual Release zone bypass (contract)', tag: ours },
    avcTamper: { label: 'AVC bypass tamper switch (optional, per zone)', tag: DI.AVC_TAMPER_TAG + '; ' + stn },
    lostComm: { label: 'Loss of communication (panel dead, or a missed DACT test)', tag: ours },
    dactChan: { label: 'DACT channel failed', tag: ours },
    dactFail: { label: 'DACT transmission failed (after the maximum attempts)', tag: '[CODE: failure indication at the premises after the maximum attempts]' },
    chgFail: { label: 'Panel battery charger failure', tag: 'Class [CODE 10.6.10.6.1 to .2]; ' + stn },
    battDisc: { label: 'Panel battery disconnected', tag: '[PRACTICE, not code]; ' + stn },
    pumpRun: { label: 'Fire pump running', tag: ours },
    pumpMode: { label: 'Fire pump controller not in auto', tag: ours },
    pumpPower: { label: 'Electric fire pump loss of power', tag: ours },
    pumpFail: { label: 'Diesel fire pump failed to start', tag: ours },
    pumpFuel: { label: 'Diesel fire pump low fuel', tag: ours },
    pumpBatt: { label: 'Diesel fire pump battery failure', tag: ours },
    tankLow: { label: 'Fire water tank low level', tag: ours },
    lowTemp: { label: 'Low room temperature', tag: ours },
  };
})();
// annunciator order and labels
DI.SIG_ORDER = { ALARM: 0, OPEN: 1, SUPV: 2, TRBL: 3 };
DI.OPEN_LABEL = 'RELEASE INPUT - CLASS NOT ELECTED';

// ---------- releasing panel power and the supervising station (NFPA 72 Ch. 10 and Ch. 26; citations in DI.REF72, read with DI.ref72(W))
// Standby battery (FA Lead, Cycle 6). The standby basis is a site setting (W.cfg.standby, read with DI.standbyKey):
// hours of standby plus minutes of alarm. Only a releasing panel exists in the game, so three rows are selectable;
// the other three are reference rows, shown in the standby dialog and the manual, never selectable and never modelled.
//   nfpa5    24 h + 5 min: the building-FACU rule (CODE, NFPA 72 10.6.7.2.2) used for a releasing panel [PRACTICE]. Default.
//   owner10  24 h + 10 min [OWNER]
//   fm90     90 h + 10 min [OWNER/insurer, FM DS 5-40 2.3.4, Sep 2007 edition, may not be current]: an election of
//            its own, never automatic on insurer = FM (the default 26 Ah battery fails it)
DI.STANDBY = [
  { key: 'nfpa5', label: 'Releasing panel, NFPA 72', hours: 24, alarmMin: 5, sel: true, tag: '[CODE NFPA 72 §10.6.7.2.2, the building-FACU rule, used for a releasing panel: PRACTICE]' },
  { key: 'owner10', label: 'Releasing panel, owner row', hours: 24, alarmMin: 10, sel: true, tag: '[OWNER]' },
  { key: 'fm90', label: 'Releasing panel, FM-insured', hours: 90, alarmMin: 10, sel: true, tag: '[OWNER/insurer, FM DS 5-40 §2.3.4, Sep 2007 edition, may not be current; releasing panel only]' },
  { key: 'facu', label: 'Building FACU', hours: 24, alarmMin: 5, sel: false, tag: '[CODE NFPA 72 §10.6.7.2.2]; reference only, not modelled' },
  { key: 'evacs', label: 'EVACS FACU', hours: 24, alarmMin: 15, sel: false, tag: '[CODE NFPA 72 §10.6.7.2]; reference only, not modelled' },
  { key: 'ess', label: 'Li-ion ESS panel', hours: 24, alarmMin: 120, sel: false, tag: '[NFPA 855 §4.8.3, upper bound; NFPA 855-2026 HOLD]; reference only, not modelled' },
];
DI.STANDBY_DEFAULT = 'nfpa5';
DI.standbyKey = (W) => { const k = W && W.cfg ? W.cfg.standby : undefined, r = DI.STANDBY.find((q) => q.key === k); return r && r.sel ? k : DI.STANDBY_DEFAULT; };
DI.standbyRow = (W) => DI.STANDBY.find((q) => q.key === DI.standbyKey(W));
// Sizing factor on the calculated capacity, by NFPA 72 edition (DI.ed72, never the NFPA 13 edition) [CODE]:
// 2019 x1.20 (10.6.7.2.1.1); 2022 and 2025 x1.25 (10.6.7.2.14).
DI.STBY_FACTOR = { 2019: 1.20, 2022: 1.25, 2025: 1.25 };
DI.STBY_THIN = 0.20;                      // PRACTICE screen, NEEDS PE REVIEW: a margin under 20 % is THIN
DI.BATT_AH = [7, 12, 18, 26, 33, 55, 65, 100];        // ASSUMED battery picks, Ah. The pick is free (SIMPLIFICATION)
// Charger (FA Lead, Cycle 7). No charger ampere rating is in NFPA 72 §10.6.10 in any edition: the picks are listing
// values, ASSUMED. chgA = 0 is "matched to the battery" (ASSUMED): no charger finding, recharge at H / 48.
// DI.chargerAh: the Ah a charger restores inside the 48 h recharge window = amperes x 48 (ASSUMED: no taper, no
// efficiency loss). A battery above that is a review FAIL: the 48 h never stretches for a bigger battery.
// Costs are ASSUMED and never read by a goal: the default panel (26 Ah, matched charger) costs what it always did.
DI.CHG_A = [0, 1, 2, 3, 4, 6, 10];
DI.BATT_COST_PER_AH = 12;
DI.CHG_COST = { 0: 0, 1: 150, 2: 220, 3: 290, 4: 360, 6: 480, 10: 700 };
DI.chargerAh = (panel) => { const a = panel && panel.p ? panel.p.chgA : 0; return a > 0 ? a * DI.RECHARGE_H : Infinity; };
DI.PANEL_LOADS = { ah: 26, iStby: 0.5, iAlarm: 2 };   // ASSUMED defaults (listing values): battery Ah, standby A, alarm A
// Generator-backed panel (site setting W.cfg.panelGen, optional, default battery only): batteries for 4 h and the
// generator covers 24 h. 2025 only (NFPA 72-2025 10.6.7.3.1(2)); under 2019 / 2022 the setting is ignored with a note.
DI.GEN_BATT_H = 4;
DI.GEN_RUN_S = 86400;                     // SIMPLIFICATION: the generator runs exactly 24 h, no fuel model
DI.GEN_START_S = 10;
DI.panelGen = (W) => !!(W && W.cfg && W.cfg.panelGen === true) && DI.ed72(W) === 2025;
// The standby calculation of one panel. Pure.
//   h      hours of standby the battery must carry (4 with the generator option)
//   req    Ah required = (standby A x h + alarm A x alarm min / 60) x factor
//   margin ah / req - 1;  below = the pick is under req (review FAIL);  thin = not below, margin under 20 % (warning)
DI.standbyCalc = function (W, panel) {
  const row = DI.standbyRow(W), ed = DI.ed72(W), factor = DI.STBY_FACTOR[ed] || 1.25, gen = DI.panelGen(W), q = (panel && panel.p) || {}, L = DI.PANEL_LOADS;
  const ah = q.ah > 0 ? q.ah : L.ah, iStby = q.iStby > 0 ? q.iStby : L.iStby, iAlarm = q.iAlarm > 0 ? q.iAlarm : L.iAlarm, h = gen ? DI.GEN_BATT_H : row.hours;
  const req = (iStby * h + iAlarm * row.alarmMin / 60) * factor, margin = ah / req - 1, below = ah < req;
  return { key: row.key, row, ed, factor, gen, h, ah, iStby, iAlarm, alarmMin: row.alarmMin, req, margin, below, thin: !below && margin < DI.STBY_THIN,

    this.cfg = {};
  }
  k(x, y) { return y * this.w + x; }
  inb(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  room(x, y) { const r = this.roomAt[this.k(x, y)]; return r ? this.rooms[r - 1] : null; }
  addRoom(type, x, y, w, h, name) {
    // a Refrigerated Space room (type `cold`) carries `below5` (held below 5 F), default false: see DI.refillLimit
    // a Telecom / MMR room (type `tel`) may carry `n76` (true / false: NFPA 76 applies here; absent = the site setting),
    // and any room may carry `f1` (the VEA Fire 1 pick of that room; absent = none): see DI.n76Applies, DI.veaFire1At
    const r = { id: this.rooms.length + 1, type, x, y, w, h, name: name || DI.ROOMS[type].name, temp: 70 };
    this.rooms.push(r);
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.roomAt[this.k(i, j)] = r.id;
    return r;
  }
  part(id) { return this.parts.get(id); }
  at(x, y) { return this.inb(x, y) ? this.parts.get(this.partAt[this.k(x, y)]) : undefined; }
  // port directions of a part: { i: dir | -1, o: dir | -1 }
  ports(p) {
    const t = DI.PARTS[p.type].ports;
    if (t === 2) return { i: (3 + p.rot) % 4, o: (1 + p.rot) % 4 };
    if (t === 'o') return { i: -1, o: (1 + p.rot) % 4 };
    if (t === 'i') return { i: (3 + p.rot) % 4, o: -1 };
    return { i: -1, o: -1 };
  }
  // does tile (x,y) offer a pipe connection toward dir?
  offers(x, y, dir) {
    if (!this.inb(x, y)) return false;
    const k = this.k(x, y);
    if (this.pd[k]) { const b = this.pk[k]; return b === 0 || (b === 1 ? (dir & 1) === 1 : (dir & 1) === 0); }
    const p = this.parts.get(this.partAt[k]);
    if (!p) return false;
    const pt = this.ports(p);
    return pt.i === dir || pt.o === dir;
  }
  // Two tiles join when each offers a connection to the other. Branch lines stay inside their own
  // room: only mains (and parts) pass through a wall, so neighbouring systems never join by accident.
  linked(x, y, dir) {
    const nx = x + DI.DX[dir], ny = y + DI.DY[dir];
    if (!this.offers(x, y, dir) || !this.offers(nx, ny, DI.OPP[dir])) return false;
    const a = this.k(x, y), b = this.k(nx, ny);
    if (this.cut[dir === 1 ? a * 2 : dir === 2 ? a * 2 + 1 : dir === 3 ? b * 2 : b * 2 + 1]) return false;
    return !((this.pk[a] || this.pk[b]) && this.roomAt[a] !== this.roomAt[b]);
  }

  canBuild(x, y) { return this.inb(x, y) && !this.partAt[this.k(x, y)]; }
  setPipe(x, y, size, kind, spk) {
    if (!this.canBuild(x, y)) return false;
    const k = this.k(x, y);
    this.pd[k] = size + 1; this.pk[k] = kind || 0;
    if (spk !== undefined) this.spk[k] = spk ? 1 : 0;
    this.ver++; return true;
  }
  // cap (or uncap) the joint on the east (south = true: south) side of tile x,y
  setCut(x, y, south, on) { if (!this.inb(x, y)) return; this.cut[this.k(x, y) * 2 + (south ? 1 : 0)] = on ? 1 : 0; this.ver++; }
  setAir(x, y, on) { if (!this.inb(x, y)) return false; this.air[this.k(x, y)] = on ? 1 : 0; this.ver++; return true; }
  addPart(type, x, y, rot, props) {
    if (!this.inb(x, y)) return null;
    const k = this.k(x, y);
    if (this.partAt[k] || this.pd[k]) return null;
    const p = { id: this.nextId++, type, x, y, rot: rot || 0, p: Object.assign({}, DI.PARTS[type].props, props || {}) };
    if (type === 'panel') p.p.chan = (props && Array.isArray(props.chan) ? props.chan : [1, 1]).slice();      // its own array, not the catalogue's
    if (type === 'dpump') p.p.fuel = 1;
    this.parts.set(p.id, p); this.partAt[k] = p.id; this.ver++;
    return p;
  }
  removePart(id) {
    const p = this.parts.get(id); if (!p) return;
    this.partAt[this.k(p.x, p.y)] = 0; this.parts.delete(id);
    this.wires = this.wires.filter((w) => w[0] !== id && w[1] !== id);
    this.ver++;
  }
  erasePipe(x, y) {
    const k = this.k(x, y); if (!this.pd[k]) return false;
    this.pd[k] = 0; this.pk[k] = 0; this.spk[k] = 0; this.cut[k * 2] = 0; this.cut[k * 2 + 1] = 0; this.ver++; return true;
  }
  // cost of whatever pipe is on a tile (for refunds)
  pipeCost(x, y) {
    const k = this.k(x, y); if (!this.pd[k]) return 0;
    return DI.pipeAt(this, k).cost + (this.spk[k] ? DI.SPK_COST : 0);
  }
  wire(a, b) {
    const pa = this.parts.get(a), pb = this.parts.get(b);
    if (!pa || !pb || a === b) return false;
    let panel = pa.type === 'panel' ? a : pb.type === 'panel' ? b : 0;
    if (!panel) return false;
    const dev = panel === a ? b : a;
    if (this.parts.get(dev).type === 'panel') return false;
    this.wires = this.wires.filter((w) => w[1] !== dev);
    this.wires.push([panel, dev]); this.ver++;
    return true;
  }
  unwire(dev) { const n = this.wires.length; this.wires = this.wires.filter((w) => w[1] !== dev && w[0] !== dev); if (this.wires.length !== n) this.ver++; }
  panelOf(dev) { for (const w of this.wires) if (w[1] === dev) return this.parts.get(w[0]); return null; }
  byType(t) { const o = []; for (const p of this.parts.values()) if (p.type === t) o.push(p); return o; }

  toJSON() {
    const rle = (a) => { const o = []; let i = 0; while (i < a.length) { let j = i; while (j < a.length && a[j] === a[i]) j++; o.push(a[i], j - i); i = j; } return o; };
    // v = the save format (8 since Cycle 8): World.fromJSON runs the NFPA 76 migration only on a save without it
    return { v: DI.SAVE_V, w: this.w, h: this.h, rooms: this.rooms, pd: rle(this.pd), pk: rle(this.pk), spk: rle(this.spk), air: rle(this.air), cut: rle(this.cut),
      parts: [...this.parts.values()], wires: this.wires, nextId: this.nextId, money: this.money, outTemp: this.outTemp, power: this.power, cfg: this.cfg };
  }
  static fromJSON(j) {
    const W = new DI.World(j.w, j.h);
    const un = (r, a) => { let k = 0; for (let i = 0; i < r.length; i += 2) { a.fill(r[i], k, k + r[i + 1]); k += r[i + 1]; } };
    // (a cold room saved under the Cycle 7 default name gets the new one: the name must not say a cold dock qualifies)
    for (const r of j.rooms) { const room = W.addRoom(r.type, r.x, r.y, r.w, r.h, r.type === 'cold' && r.name === DI.COLD_OLD_NAME ? undefined : r.name); if (r.below5 === true) room.below5 = true;
      if (r.n76 === true || r.n76 === false) room.n76 = r.n76; if (typeof r.f1 === 'number') room.f1 = r.f1; }
    un(j.pd, W.pd); un(j.pk, W.pk); un(j.spk, W.spk); un(j.air, W.air); if (j.cut) un(j.cut, W.cut);
    for (const p of j.parts) { DI.migratePart(p); W.parts.set(p.id, p); W.partAt[W.k(p.x, p.y)] = p.id; }
    W.cfg = Object.assign({}, j.cfg || {}); delete W.cfg.pipePolicy;      // the role-based schedule policy is gone: an old save gets the default size cut
    // Cycle 7: the site refrigerated flag became a per-zone rule (a freezer room held below 5 F). An old save that had
    // it set loads with the flag deleted and every zone at 30 min; Sim.restore says so once (W.notes). ASSUMED migration.
    if (W.cfg.refrigerated === true) W.notes = [DI.COLD_MIGRATED];
    delete W.cfg.refrigerated;
    // Cycle 8: NFPA 76 applies by room (a telecom room), and the site flag is only the default for telecom rooms. A
    // save from before that (no `v`) with the flag on: (1) a VEA site with no stored Fire 1 pick read 0.5 everywhere
    // through the flag, so 0.5 is written as the site pick and every room keeps the sensitivity it had; (2) it has
    // no telecom room, so no room is checked any more: Sim.restore says so once (W.notes). Flag off: nothing changes.
    if (!(j.v >= 8) && W.cfg.nfpa76Adopted === true) {
      const notes = [];
      if (!W.rooms.some((r) => r.type === 'tel')) notes.push(DI.N76_MIGRATED);
      if (DI.isVea(W) && DI.veaSitePick(W) === null) { const t = DI.VESDA_T.slice(); t[2] = DI.VEA_TEL; W.cfg.detThr = t; notes.push(DI.N76_PICK_KEPT); }
      if (notes.length) W.notes = (W.notes || []).concat(notes);
    }
    W.wires = j.wires || []; W.nextId = j.nextId; W.money = j.money; W.outTemp = j.outTemp === undefined ? 70 : j.outTemp;
    W.power = j.power !== false;          // utility power is saved with the world; a save from before that has no field and reads on
    return W;
  }
};

<script>
// Hydraulic network solver: Todini's Global Gradient Algorithm (the method EPANET uses),
// extended with a node capacitance term so trapped pressure, pump cycling and dry-system
// filling are all the same equation:
//     sum(Q in) - sum(Q out) = 60*C/dt * (P - Pprev)        [gpm; C in gal/psi]
// Link head loss a->b:  h(Q) = r*Q|Q|^0.85 + m*Q|Q| - pumpGain(Q)   [psi]
//   r = Hazen-Williams term, m = minor/orifice term (an open sprinkler is m = 1/K^2 to atmosphere).
var DI = globalThis.DI || (globalThis.DI = {});

DI.Net = class {
  constructor() { this.n = 0; this.cap = []; this.pPrev = []; this.fix = []; this.dem = []; this.links = []; this.P = null; }
  node(pPrev, cap, fixed) {
    this.cap.push(cap || 0); this.pPrev.push(pPrev || 0); this.fix.push(fixed === undefined ? NaN : fixed); this.dem.push(0);
    return this.n++;
  }
  link(a, b, o) {
    const l = { a, b, r: 0, m: 0, chk: false, pump: null, open: true, q: 0, tag: null };
    Object.assign(l, o); this.links.push(l); return l;
  }
};

DI.linkLoss = function (l, q, out) {      // out[0] = h, out[1] = dh/dq
  const aq = Math.abs(q);
  let h = l.r * q * Math.pow(aq, 0.85) + l.m * q * aq;
  let g = 1.85 * l.r * Math.pow(aq, 0.85) + 2 * l.m * aq;
  const pm = l.pump;
  if (pm && pm.spd > 0.02) {
    const s = pm.spd, qs = pm.gpm * s, x = Math.max(q, 0) / qs, e = DI.PUMP_EXP;
    h -= pm.psi * s * s * (1.2 - 0.2 * Math.pow(x, e));
    g += pm.psi * s * s * 0.2 * e * Math.pow(x, e - 1) / qs;
  }
  out[0] = h; out[1] = g < 1e-5 ? 1e-5 : g;
};

DI.solve = function (net, dt, maxIter) {
  const n = net.n, L = net.links, nl = L.length;
  const row = new Int32Array(n); let nf = 0;
  for (let i = 0; i < n; i++) row[i] = isNaN(net.fix[i]) ? nf++ : -1;
  const P = net.P && net.P.length === n ? net.P : (net.P = new Float64Array(n));
  for (let i = 0; i < n; i++) P[i] = row[i] < 0 ? net.fix[i] : net.pPrev[i];
  const cc = 60 / (dt > 0 && isFinite(dt) ? dt : 1e12);
  const A = new Float64Array(nf * nf), F = new Float64Array(nf), o = [0, 0];
  const lp = new Float64Array(nl), ly = new Float64Array(nl);
  let it = 0, ok = false;
  maxIter = maxIter || 40;
  for (; it < maxIter; it++) {
    A.fill(0);
    for (let i = 0; i < n; i++) {
      const r = row[i]; if (r < 0) continue;
      const c = net.cap[i] * cc + 1e-9;
      A[r * nf + r] = c; F[r] = c * net.pPrev[i] - net.dem[i];
    }
    for (let k = 0; k < nl; k++) {
      const l = L[k];
      if (!l.open) { lp[k] = 0; ly[k] = 0; continue; }
      DI.linkLoss(l, l.q, o);
      const p = 1 / o[1], y = l.q - p * o[0];
      lp[k] = p; ly[k] = y;
      const ra = row[l.a], rb = row[l.b];
      if (ra >= 0) { A[ra * nf + ra] += p; F[ra] -= y; if (rb >= 0) A[ra * nf + rb] -= p; else F[ra] += p * P[l.b]; }
      if (rb >= 0) { A[rb * nf + rb] += p; F[rb] += y; if (ra >= 0) A[rb * nf + ra] -= p; else F[rb] += p * P[l.a]; }
    }
    // Gaussian elimination (A is symmetric positive definite, no pivoting needed)
    for (let i = 0; i < nf; i++) {
      const d = A[i * nf + i];
      for (let j = i + 1; j < nf; j++) {
        const f = A[j * nf + i]; if (f === 0) continue;
        const m = f / d;
        for (let c = i; c < nf; c++) A[j * nf + c] -= m * A[i * nf + c];
        F[j] -= m * F[i];
      }
    }
    for (let i = nf - 1; i >= 0; i--) {
      let s = F[i];
      for (let c = i + 1; c < nf; c++) s -= A[i * nf + c] * F[c];
      F[i] = s / A[i * nf + i];
    }
    for (let i = 0; i < n; i++) if (row[i] >= 0) P[i] = F[row[i]];
    // flow update + check-valve status
    let dq = 0, sq = 0, flip = false;
    for (let k = 0; k < nl; k++) {
      const l = L[k], dp = P[l.a] - P[l.b];
      if (!l.open) {
        if (l.chk && !l.shut) { DI.linkLoss(l, 0, o); if (dp - o[0] > 0.01) { l.open = true; l.q = 0.01; flip = true; } }
        continue;
      }
      let q = ly[k] + lp[k] * dp;
      if (l.chk && q < -1e-4) { q = 0; l.open = false; flip = true; }
      dq += Math.abs(q - l.q); sq += Math.abs(q);
      l.q = q;
    }
    if (!flip && (dq < 0.02 || dq < 1e-3 * sq)) { ok = true; it++; break; }
  }
  net.iters = it; net.ok = ok;
  return ok;
};

<script>
// System discovery: what does each riser (wet / dry / preaction valve) actually feed?
// Flood-fills downstream of every system valve and records volume, sprinkler count, rooms,
// the hydraulically remote sprinkler, loops (gridding) and illegal cross-connections.
// Also resolves the air / nitrogen tubing layer: which gas sources feed which valve.
var DI = globalThis.DI || (globalThis.DI = {});

DI.SYSV = { wetv: 1, dryv: 1, prev: 1 };

DI.findSystems = function (W) {
  const n = W.w * W.h, DX = DI.DX, DY = DI.DY;
  const tileSys = new Int32Array(n), par = new Int32Array(n).fill(-1), dvol = new Float32Array(n), tdist = new Int32Array(n);
  const info = new Map();
  for (const v of W.parts.values()) {
    if (!DI.SYSV[v.type]) continue;
    const s = { id: v.id, type: v.type, vol: 0, nSpk: 0, tiles: [], rooms: new Set(), remote: -1, remDist: -1, gridded: false,
      bypass: false, fed: false, src: [], hasN2: false, hasAir: false, area: 0, thru: new Set() };
    info.set(v.id, s);
    const kv = W.k(v.x, v.y); tileSys[kv] = v.id;
    const o = W.ports(v).o;
    s.fed = W.linked(v.x, v.y, W.ports(v).i);
    if (!W.linked(v.x, v.y, o)) continue;
    const q = [[v.x + DX[o], v.y + DY[o], kv, 1, 0]];
    for (let h = 0; h < q.length; h++) {
      const [x, y, from, dist, vol] = q[h], k = W.k(x, y);
      if (tileSys[k] === v.id) { if (k !== kv) s.gridded = true; else s.bypass = true; continue; }
      if (tileSys[k]) { s.bypass = true; continue; }
      const p = W.at(x, y);
      if (p) {
        const t = DI.PARTS[p.type];
        if (p.type === 'fdc' || p.type === 'testhdr') { tileSys[k] = v.id; continue; }     // legitimate dead ends on a system
        if (t.ports !== 2 || DI.SYSV[p.type] || p.type === 'epump' || p.type === 'dpump' || p.type === 'jockey') { s.bypass = true; continue; }
        tileSys[k] = v.id; par[k] = from; dvol[k] = vol;
        const pp = W.ports(p);
        for (const d of [pp.i, pp.o]) {
          const nx = x + DX[d], ny = y + DY[d];
          if (W.linked(x, y, d) && W.k(nx, ny) !== from) q.push([nx, ny, k, dist + 1, vol]);
        }
        continue;
      }
      if (!W.pd[k]) continue;
      const g = DI.pipeAt(W, k).gal * DI.TILE_FT;
      tileSys[k] = v.id; par[k] = from; dvol[k] = vol + g / 2; tdist[k] = dist;
      s.vol += g; s.tiles.push(k);
      const rm = W.roomAt[k]; if (rm) s.thru.add(rm);
      if (W.spk[k]) { s.nSpk++; s.area += 100; if (rm) s.rooms.add(rm); if (dist > s.remDist) { s.remDist = dist; s.remote = k; } }
      for (let d = 0; d < 4; d++) {
        const nx = x + DX[d], ny = y + DY[d];
        if (W.linked(x, y, d) && W.k(nx, ny) !== from) q.push([nx, ny, k, dist + 1, vol + g]);
      }
    }
  }
  // air / nitrogen tubing: flood each tubing network, collect the parts that touch it
  const seen = new Uint8Array(n);
  for (let k0 = 0; k0 < n; k0++) {
    if (!W.air[k0] || seen[k0]) continue;
    const st = [k0], touch = new Set(); seen[k0] = 1;
    while (st.length) {
      const k = st.pop(), x = k % W.w, y = (k / W.w) | 0;
      if (W.partAt[k]) touch.add(W.partAt[k]);
      for (let d = 0; d < 4; d++) {
        const nx = x + DX[d], ny = y + DY[d];
        if (!W.inb(nx, ny)) continue;
        const nk = W.k(nx, ny);
        if (W.partAt[nk]) touch.add(W.partAt[nk]);
        if (W.air[nk] && !seen[nk]) { seen[nk] = 1; st.push(nk); }
      }
    }
    const srcs = [...touch].filter((id) => { const t = W.part(id).type; return t === 'comp' || t === 'n2'; });
    for (const id of touch) {
      const s = info.get(id);
      if (!s || s.type === 'wetv') continue;
      for (const sid of srcs) if (!s.src.includes(sid)) s.src.push(sid);
    }
  }
  for (const s of info.values()) {
    s.hasN2 = s.src.some((id) => W.part(id).type === 'n2');
    s.hasAir = s.src.some((id) => W.part(id).type === 'comp');
  }
  // fraction of the system that must fill before water reaches tile k (dry / preaction transit)
  const reach = (sid, k) => { const s = info.get(sid); if (!s || s.vol <= 0) return 0; return Math.min(1, (dvol[k] + 0.35 * (s.vol - dvol[k])) / s.vol); };
  return { tileSys, par, dvol, tdist, info, reach };
};

// Sprinkler coverage of one room: tiles that need a head, tiles that have one, heads on no system.
DI.roomCoverage = function (W, sd, room) {
  let need = 0, have = 0, orphan = 0;
  for (let y = room.y; y < room.y + room.h; y++) for (let x = room.x; x < room.x + room.w; x++) {
    const k = W.k(x, y); if (W.partAt[k]) continue; need++;
    if (W.spk[k]) { have++; if (!sd.tileSys[k]) orphan++; }
    else if (W.pd[k] && (W.spk[k - 1] || W.spk[k + 1] || W.spk[k - W.w] || W.spk[k + W.w])) have++;   // a main between branch lines
  }
  return { need, have, orphan };
};

// Nearest control valve upstream of a system valve (walk the supply pipe run back from the riser inlet).
DI.ctrlValve = function (W, id) {
  const v = W.parts.get(id); if (!v) return null;
  const seen = new Set(), q = [[v.x, v.y, W.ports(v).i]];
  for (let h = 0; h < q.length && h < 400; h++) {
    const [x, y, d] = q[h]; if (!W.linked(x, y, d)) continue; const nx = x + DI.DX[d], ny = y + DI.DY[d], k = W.k(nx, ny); if (seen.has(k)) continue; seen.add(k);
    const o = W.at(nx, ny); if (o) { if (o.type === 'gate') return o; continue; }
    for (let e = 0; e < 4; e++) if (e !== DI.OPP[d]) q.push([nx, ny, e]);
  }
  return null;
};

// Every control valve on the supply path of a system valve, nearest first: the same walk, carried on through each
// control valve, backflow preventer, check valve and pump to the supply. Used by the main drain follow-up
// (DI.dropCheck): a partly closed valve anywhere upstream lowers the residual reading.
DI.supplyValves = function (W, id) {
  const v = W.parts.get(id), out = []; if (!v) return out;
  const seen = new Set(), q = [[v.x, v.y, W.ports(v).i]];
  for (let h = 0; h < q.length && h < 4000; h++) {
    const [x, y, d] = q[h]; if (!W.linked(x, y, d)) continue; const nx = x + DI.DX[d], ny = y + DI.DY[d], k = W.k(nx, ny); if (seen.has(k)) continue; seen.add(k);
    const o = W.at(nx, ny);
    if (o) { if (DI.SYSV[o.type]) continue; if (o.type === 'gate') out.push(o); const pt = W.ports(o); if (pt.i >= 0 && pt.o === DI.OPP[d]) q.push([nx, ny, pt.i]); continue; }
    for (let e = 0; e < 4; e++) if (e !== DI.OPP[d]) q.push([nx, ny, e]);
  }
  return out;
};

// ---------- water delivery
// Full zone volume = pipe + a fittings allowance + the valve trim (project settings, ASSUMED 5 % and 2 gal).
// inf.vol stays pipe only; every delivery rule is judged on the zone volume.
DI.zoneVolume = (W, inf) => inf.vol * (1 + DI.cfgNum(W, 'fitPct') / 100) + DI.cfgNum(W, 'trimGal');
// the most demanding hazard among the rooms a system protects (key into DI.HAZ)
DI.sysHazard = function (W, inf) {
  let key = '';
  for (const r of inf.rooms) { const h = DI.ROOMS[W.rooms[r - 1].type].haz; if (!key || DI.HAZ[h].dens > DI.HAZ[key].dens) key = h; }
  return key || 'OH1';
};

// Detection, the releasing panel, supervisory / alarm / trouble signals and the fire department.
// A device only reaches the panel (and the outside world) if the player wired it there.
var DI = globalThis.DI || (globalThis.DI = {});

// Aspirating detection stages. The four thresholds (%/ft obscuration) are a site setting (W.cfg.detThr); these
// defaults are owner-set example values inside the listed range of the detector model (DI.asdRange), ASSUMED and
// NEEDS PE REVIEW: the datasheets print setting ranges, not defaults.
//   Alert  = pre-alarm, never arms a release. Signal class is a site setting (DI.sigClass), supervisory by default.
//   Action = pre-alarm annunciation: no release. Signal class is a site setting, supervisory by default.
//   Fire 1 = alarm, and the detection leg (D) of the double interlock. D is a level check: level >= Fire 1.
//   Fire 2 = escalation only. It is never read as a release input by itself. A reading that jumps straight
//            to Fire 2 is at or above Fire 1, so it is D, and every stage it crossed is annunciated in order.
DI.VESDA_T = [0.03, 0.06, 0.12, 1.2];

DI.FIRE1 = 3;                             // the stage that releases
// Spot detector alarm threshold: site setting W.cfg.spotThr, read with DI.spotThr(W) (example value 1.3 %/ft,

        if (!q.battDisc && q.battH <= DI.lowBattH(DI.panelH(W, p))) add('lb' + p.id, 'lowBatt', 'LOW BATTERY - panel #' + p.id + ' (' + DI.LOWBATT_V + ' V listed setpoint, ASSUMED)' + (W.power ? (q.chgFail ? ' (not charging)' : ' (charging)') : ''), p);
        if (q.chgFail) add('cf' + p.id, 'chgFail', 'CHARGER FAILURE - panel #' + p.id + ' (battery not charging)', p);
        if (q.battDisc) add('bd' + p.id, 'battDisc', 'BATTERY DISCONNECTED - panel #' + p.id, p);
        // DACT path only: the two channels (q.chan, 1 = up). One channel down: a trouble at the panel at once, sent on
        // the other channel within 4 minutes (DI.DACT_CHAN_S) [CODE]. Both down: the panel cannot send, so the trouble
        // stays at the panel (delay Infinity) and the supervising station reports a missed test one test interval
        // after the second channel failed (q.chanT; DI.commDelay, the 6 h interval: that annunciation time is ASSUMED).
        // Once a signal has been tried for DI.DACT_TOTAL_S (10 attempts) the panel raises the failure indication at
        // the premises [CODE], and it stays until a channel is back. The queue itself is DI.dactStep.
        const down = DI.commPath(W) === 'dact' && Array.isArray(q.chan) ? (q.chan[0] ? 0 : 1) + (q.chan[1] ? 0 : 1) : 0;
        if (down < 2) { if (q.chanT !== undefined) delete q.chanT; } else if (!(q.chanT >= 0)) q.chanT = S.t;
        if (down === 1) add('dc' + p.id, 'dactChan', 'DACT CHANNEL FAILED - panel #' + p.id + ' (trouble sent on the other channel within ' + DI.delayText(DI.DACT_CHAN_S) + ')', p, false, DI.DACT_CHAN_S);
        else if (down === 2) {
