<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Interlock</title>
<style>
:root { --bg:#0a0f14; --pan:#111922; --pan2:#16212c; --line:#243342; --ink:#d7e2ea; --dim:#7f93a3; --red:#ff4b3a; --amb:#ffb224; --yel:#ffe45c; --grn:#3ddc91; --wat:#3aa6ff; --air:#e9d8a0; --n2:#6fe3c6; --mono:'Cascadia Mono','Consolas','SF Mono',Menlo,monospace; --ui:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font:13px/1.4 var(--ui); user-select:none; }
#cv { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
button { font:inherit; color:var(--ink); background:var(--pan2); border:1px solid var(--line); border-radius:4px; padding:4px 9px; cursor:pointer; }
button:hover { border-color:#4b6377; background:#1c2a37; }
button:disabled { opacity:.4; cursor:default; }
button.on { background:#20405a; border-color:var(--wat); color:#fff; }
button.hot { background:#3a1612; border-color:var(--red); color:#ffd9d3; font-weight:600; }
button.go { background:#12382a; border-color:var(--grn); color:#d9ffee; font-weight:600; }
button.pill { border-radius:12px; padding:3px 10px; }
#top { position:fixed; top:0; left:0; right:0; height:42px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 10px; background:linear-gradient(#121b25,#0e151d); border-bottom:1px solid var(--line); z-index:5; }
#top > div { display:flex; align-items:center; gap:6px; white-space:nowrap; }
#scName { font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:12px; }
#scName small { display:block; font-weight:400; letter-spacing:.02em; text-transform:none; color:var(--dim); font-size:11px; margin-top:-2px; }
#clock { font:600 15px var(--mono); min-width:112px; text-align:right; color:#fff; }
#wx { font:12px var(--mono); color:var(--dim); margin-left:8px; }
#money { font:600 15px var(--mono); color:var(--grn); margin-right:6px; }
#money.neg { color:var(--red); }
.sp { padding:3px 7px; font:12px var(--mono); }
#ann { position:fixed; left:10px; top:52px; width:292px; max-height:calc(100% - 190px); display:flex; flex-direction:column; background:rgba(13,20,27,.94); border:1px solid var(--line); border-radius:6px; z-index:4; overflow:hidden; }
#ann .hd { font:700 10.5px var(--mono); letter-spacing:.12em; padding:6px 8px; background:#0c1218; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
#ann .hd2 { font:700 10px var(--mono); letter-spacing:.12em; color:var(--dim); padding:4px 8px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
#annState { color:var(--grn); }
#annState.al { color:var(--red); animation:blink .6s steps(2) infinite; } #annState.sv { color:var(--amb); } #annState.tr { color:var(--yel); }
@keyframes blink { 50% { opacity:.25; } }
#sigs { overflow:auto; max-height:230px; }
.sig { display:flex; gap:6px; padding:4px 8px; border-bottom:1px solid #18232e; font:11.5px var(--mono); cursor:pointer; }
.sig b { flex:none; width:46px; } .sig.ALARM b { color:var(--red); } .sig.SUPV b { color:var(--amb); } .sig.TRBL b { color:var(--yel); }
.sig.loc { opacity:.55; } .sig:hover { background:#17222d; }
.sig.OPEN b { color:#c59bff; } .sig.sup { opacity:.5; } .sig.sup b { text-decoration:line-through; }
.sig.stn { background:#1a1a0c; } .sig.stn em { font-style:normal; color:var(--yel); margin-right:4px; }
#annState.op { color:#c59bff; } #annState.sil { animation:none; }
.res .gov { color:#fff; font-weight:700; border-bottom:1px solid var(--amb); }
#log { overflow:auto; flex:1; min-height:60px; max-height:220px; padding:3px 0; font:11px var(--mono); }
#log div { padding:1px 8px; color:var(--dim); } #log .bad { color:#ff9488; } #log .warn { color:#ffcf73; } #log .good { color:#8ff0c1; } #log i { color:#4d6272; font-style:normal; margin-right:5px; }
#side { position:fixed; right:10px; top:52px; width:318px; max-height:calc(100% - 150px); overflow:auto; background:rgba(13,20,27,.95); border:1px solid var(--line); border-radius:6px; z-index:4; padding:0 0 8px; }
#side:empty { display:none; }
#side h3 { margin:0; padding:8px 10px 6px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; background:#0c1218; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
#side h3 small { color:var(--dim); font-weight:400; text-transform:none; letter-spacing:0; }
#side p { margin:7px 10px; color:#a9bac7; font-size:12px; }
#side .row { display:flex; justify-content:space-between; gap:8px; padding:2px 10px; font-size:12px; } #side .row b { font:600 12px var(--mono); color:#fff; text-align:right; }
#side .row b.bad { color:var(--red); } #side .row b.good { color:var(--grn); } #side .row b.warn { color:var(--amb); }
#side .btns { display:flex; flex-wrap:wrap; gap:5px; padding:6px 10px 2px; } #side .btns button { font-size:12px; padding:3px 8px; }
#side .sec { margin:8px 0 2px; padding:3px 10px; font:700 10px var(--mono); letter-spacing:.12em; color:var(--dim); border-top:1px solid var(--line); }
#side canvas { display:block; margin:6px auto 0; }
#side .res { margin:6px 10px; padding:6px 8px; border-left:3px solid var(--line); background:#0f1820; font:11.5px var(--mono); color:#b9c8d3; } .res.pass { border-color:var(--grn); } .res.fail { border-color:var(--red); } .res b { display:block; color:#fff; margin-bottom:2px; }
.stp { display:inline-flex; align-items:center; gap:3px; } .stp button { padding:0 6px; font:12px var(--mono); line-height:18px; }
#tools { position:fixed; left:8px; right:8px; bottom:8px; margin:0 auto; width:fit-content; display:flex; flex-direction:column; gap:5px; padding:6px 9px 7px; background:rgba(13,20,27,.96); border:1px solid var(--line); border-radius:8px; z-index:4; max-width:calc(100% - 16px); }
#tools .rowg { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; row-gap:6px; }
#tools .grp { display:flex; flex-direction:column; gap:3px; padding-right:10px; border-right:1px solid var(--line); } #tools .grp:last-child { border:0; padding-right:0; }
#tools .grp > span { font:700 9px var(--mono); letter-spacing:.12em; color:var(--dim); }
#tools .bs { display:flex; gap:4px; }
.tb { width:52px; height:50px; padding:2px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:1px; font-size:9.5px; line-height:1.05; position:relative; color:#b8c7d2; white-space:nowrap; overflow:hidden; }
.tb canvas { width:28px; height:28px; flex:none; } .tb kbd { position:absolute; top:1px; left:3px; font:9px var(--mono); color:var(--dim); } .tb.on { box-shadow:0 0 0 1px var(--wat) inset; }
.tb.sz { width:34px; height:24px; justify-content:center; font:11px var(--mono); } .szs { display:grid; grid-template-columns:repeat(6,34px); gap:2px; }
#hint { font-size:12px; color:#c6d4de; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; min-height:17px; }
#banner { position:fixed; left:50%; top:56px; transform:translateX(-50%); max-width:560px; padding:9px 16px; background:rgba(60,14,10,.95); border:1px solid var(--red); border-radius:6px; font-size:14px; font-weight:600; color:#ffe2dd; z-index:6; opacity:0; transition:opacity .4s; pointer-events:none; text-align:center; }
#banner.show { opacity:1; }
#tip { position:fixed; padding:5px 8px; background:#0b1117; border:1px solid var(--line); border-radius:4px; font:11.5px var(--mono); color:#cfe0ea; z-index:7; pointer-events:none; display:none; white-space:pre; }
#pop { position:fixed; z-index:8; display:none; background:#0f1820; border:1px solid var(--line); border-radius:6px; padding:5px; min-width:170px; }
#pop button { display:block; width:100%; text-align:left; margin:2px 0; border:0; background:none; } #pop button:hover { background:#1c2a37; }
#modal { position:fixed; inset:0; background:rgba(4,7,10,.74); z-index:20; display:none; align-items:center; justify-content:center; }
#modal.show { display:flex; }
#mbox { width:min(860px,94vw); max-height:90vh; overflow:auto; background:var(--pan); border:1px solid #2f4254; border-radius:8px; padding:22px 26px; box-shadow:0 20px 80px #000; user-select:text; }
#mbox h1 { margin:0 0 2px; font-size:30px; letter-spacing:.22em; font-weight:800; } #mbox h1 span { color:var(--red); }
#mbox h2 { margin:0 0 4px; font-size:19px; letter-spacing:.08em; text-transform:uppercase; } #mbox h4 { margin:14px 0 4px; font:700 11px var(--mono); letter-spacing:.14em; color:var(--dim); }
#mbox p { color:#b6c6d2; margin:8px 0; font-size:14px; line-height:1.55; } #mbox li { color:#b6c6d2; margin:3px 0; font-size:13.5px; }
#mbox .sub { color:var(--dim); font:12px var(--mono); letter-spacing:.08em; margin-bottom:12px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; margin-top:12px; }
.card { text-align:left; padding:11px 12px; border-radius:6px; background:var(--pan2); border:1px solid var(--line); } .card b { display:block; font-size:14px; letter-spacing:.05em; text-transform:uppercase; } .card small { color:var(--dim); display:block; margin-top:2px; } .card i { float:right; font-style:normal; color:var(--amb); letter-spacing:2px; }
.card.lock { opacity:.42; } .card em { font:700 10px var(--mono); color:var(--dim); font-style:normal; letter-spacing:.12em; }
.goal { display:flex; gap:8px; padding:6px 0; border-bottom:1px solid #1b2733; font-size:13.5px; } .goal i { flex:none; width:18px; font-style:normal; color:var(--dim); } .goal.ok i { color:var(--grn); } .goal.ok { color:#9fb3c1; } .goal small { display:block; color:var(--dim); margin-top:2px; }
.find { padding:6px 8px; margin:5px 0; border-left:3px solid var(--amb); background:#0f1820; cursor:pointer; font-size:13px; } .find.fail { border-color:var(--red); } .find.ok { border-color:var(--grn); } .find.info { border-color:var(--wat); } .find small { display:block; color:var(--dim); font:11px var(--mono); margin-top:2px; }
.mrow { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; align-items:center; } .mrow button { padding:7px 16px; font-size:14px; }
.man { display:grid; grid-template-columns:190px 1fr; gap:18px; } .man nav button { display:block; width:100%; text-align:left; margin-bottom:3px; border:0; background:none; color:#a9bac7; } .man nav button.on { background:#1c2a37; color:#fff; }
.man table { border-collapse:collapse; margin:8px 0; font-size:13px; } .man td, .man th { border:1px solid var(--line); padding:4px 8px; text-align:left; color:#b6c6d2; } .man th { color:#fff; background:#0f1820; }
.stars { font-size:34px; letter-spacing:6px; color:var(--amb); } .stars s { color:#2c3b49; text-decoration:none; }
#imp:empty { display:none; } #imp { border-bottom:1px solid var(--line); background:#1d1608; }
#imp .hd3 { font:700 10px var(--mono); letter-spacing:.12em; color:var(--amb); padding:4px 8px 2px; }
#imp .imp { padding:2px 8px 5px; font:11.5px var(--mono); color:#ffd590; cursor:pointer; } #imp .imp:hover { background:#2a1f0a; }
#side p.imp { margin:6px 10px 2px; padding:4px 8px; border-left:3px solid var(--amb); background:#1d1608; color:#ffd590; font:11.5px var(--mono); }
#mbox.wide { width:min(1280px,96vw); } #mbox p.impTag { border-left:3px solid var(--amb); padding-left:10px; color:#ffd590; }
.ce { border-collapse:collapse; width:100%; margin:10px 0; font:11.5px/1.35 var(--mono); } .ce th, .ce td { border:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; color:#b6c6d2; } .ce th { color:#fff; background:#0f1820; position:sticky; top:-22px; }
.ce tr.off td { color:#566878; } .ce tr.live td { background:#2a1d0c; color:#ffe2b0; } .ce .now { display:block; color:var(--amb); font-weight:700; letter-spacing:.06em; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <div class="tl"><button id="bMenu" title="Contracts">&#9776;</button><div id="scName"></div><button id="bGoals" class="pill">Goals <span id="goalN"></span></button></div>
  <div class="tc">
    <div id="clock">00:00:00</div>
    <button class="sp" data-sp="0" title="Pause (Space)">&#10073;&#10073;</button><button class="sp on" data-sp="1">1&times;</button><button class="sp" data-sp="4">4&times;</button><button class="sp" data-sp="20">20&times;</button><button class="sp" data-sp="120">120&times;</button>
    <button id="bSkip" title="Skip ahead">Skip &#9662;</button>
    <div id="wx"></div>
  </div>
  <div class="tr"><div id="money"></div><button id="bSite" title="Site settings: enforced edition, pipe size cut, water delivery, detection thresholds, signal classes, company rules. Read-only in a contract">Site</button><button id="bReview">Review</button><button id="bTests">Tests</button><button id="bInc">Incident</button><button id="bDrill" class="hot">Run drill</button><button id="bManual" title="Field manual (M)">Manual</button><button id="bSnd" title="Sound">&#9835;</button></div>
</div>
<div id="ann"><div class="hd">FIRE ALARM ANNUNCIATOR <span id="annState">NORMAL</span></div><div id="imp"></div><div id="sigs"></div><div class="hd2">EVENT LOG</div><div id="log"></div></div>
<div id="side"></div>
<div id="tools"></div>
<div id="banner"></div>
<div id="tip"></div>
<div id="pop"></div>
<div id="modal"><div id="mbox"></div></div>
<script>
// DOUBLE INTERLOCK - core namespace, constants, helpers.
// Units everywhere: psi (gauge), gpm, gallons, feet, seconds. One map tile = 10 ft.
var DI = globalThis.DI || (globalThis.DI = {});

DI.TILE_FT = 10;
DI.ATM = 14.7;            // psia
DI.PSI_FT = 0.433;        // psi per ft of water column
DI.DX = [0, 1, 0, -1];    // dir 0=N 1=E 2=S 3=W
DI.DY = [-1, 0, 1, 0];
DI.OPP = [2, 3, 0, 1];

DI.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
DI.lerp = (a, b, t) => a + (b - a) * t;
DI.fmt = (v, d = 0) => (isFinite(v) ? v.toFixed(d) : '--');
DI.money = (v) => (v < 0 ? '-$' : '$') + Math.round(Math.abs(v)).toLocaleString('en-US');
DI.clock = (s) => {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  const p = (n) => String(n).padStart(2, '0');
  return (d ? 'D' + (d + 1) + ' ' : '') + p(h) + ':' + p(m) + ':' + p(x);
};
DI.dur = (s) => (s < 90 ? DI.fmt(s, s < 10 ? 1 : 0) + ' s' : s < 5400 ? DI.fmt(s / 60, 1) + ' min' : DI.fmt(s / 3600, 1) + ' h');

DI.rng = function (seed) {           // mulberry32
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

// tiny event bus
DI.bus = {
  h: {},
  on(ev, fn) { (this.h[ev] || (this.h[ev] = [])).push(fn); },
  emit(ev, a, b, c) { const l = this.h[ev]; if (l) for (let i = 0; i < l.length; i++) l[i](a, b, c); },
};

// Pipe table, split by schedule. id40 / id10 = inside diameter (in) of Schedule 40 / Schedule 10 steel pipe
// (steel pipe dimensions table in the NFPA 13 annex / ASME B36.10M), cost = $ per 10-ft tile installed.
// ASSUMED: cost is the same for both schedules of a size.
// 12 in. Sch 10 is OD 12.750, wall 0.180, ID 12.390 (FP Lead): above-ground headers only. Underground and
// yard pipe would be its own material (ductile iron, PVC / HDPE), still C = 100, and is not modelled.
DI.PIPES = [
  { n: '1"', id40: 1.049, id10: 1.097, cost: 90 },
  { n: '1¼"', id40: 1.38, id10: 1.442, cost: 110 },
  { n: '1½"', id40: 1.61, id10: 1.682, cost: 130 },
  { n: '2"', id40: 2.067, id10: 2.157, cost: 170 },
  { n: '2½"', id40: 2.469, id10: 2.635, cost: 230 },
  { n: '3"', id40: 3.068, id10: 3.26, cost: 290 },
  { n: '4"', id40: 4.026, id10: 4.26, cost: 400 },
  { n: '6"', id40: 6.065, id10: 6.357, cost: 640 },
  { n: '8"', id40: 7.981, id10: 8.249, cost: 900 },
  { n: '10"', id40: 10.02, id10: 10.37, cost: 1250 },
  { n: '12"', id40: 11.938, id10: 12.39, cost: 1600 },
];
// Pipe size cut (project setting W.cfg.pipeCut, ASSUMED default 2 in.): the largest size on threaded Sch 40.
// That size and smaller are threaded Sch 40; every larger size is roll-grooved Sch 10, main or branch alike.
DI.PIPE_CUT_DEFAULT = 3;               // index into DI.PIPES: 2 in.
DI.PIPE_CUTS = [2, 3, 4, 5, 6];        // sizes the Site menu offers as the cut: 1½ in. to 4 in.
DI.PIPES.forEach((p, i) => {
  const mk = (id, sch) => ({ n: p.n, id, gal: 0.0408 * id * id, cost: p.cost, sch });   // gal/ft = 0.0408 d^2
  p.s40 = mk(p.id40, 40); p.s10 = mk(p.id10, 10);
  const d = i <= DI.PIPE_CUT_DEFAULT ? p.s40 : p.s10; p.id = d.id; p.gal = d.gal;       // default-cut values
});
DI.pipeCut = (W) => { const c = W && W.cfg ? W.cfg.pipeCut : undefined; return DI.PIPE_CUTS.includes(c) ? c : DI.PIPE_CUT_DEFAULT; };
// schedule of size index i for a given cut
DI.pipeSch = (cut, i) => (i <= cut ? 40 : 10);
// the pipe on tile k: { n, id, gal, cost, sch }. Every engine and UI reader goes through this.
DI.pipeAt = (W, k) => { const i = W.pd[k] - 1, p = DI.PIPES[i]; return DI.pipeSch(DI.pipeCut(W), i) === 40 ? p.s40 : p.s10; };

// Hazen-Williams: friction loss in psi per foot at 1 gpm (multiply by Q^1.85).
// p = 4.52 Q^1.85 / (C^1.85 d^4.87)   (NFPA 13)
DI.hw = (C, d) => 4.52 / (Math.pow(C, 1.85) * Math.pow(d, 4.87));
// Company rule: C = 100 for all sprinkler pipe: wet, dry, preaction, interior, yard and underground.
// Nitrogen earns no C-factor credit. Any other C shown in the UI is a comparison label only.
DI.HW_C = 100;
DI.pipeC = () => DI.HW_C;

// Hazard table: required density (gpm/ft2), design area (ft2), hose (gpm), duration (min),
// fire growth alpha (kW/s2). Single-point density/area values (NFPA 13 Ch. 19; the enforced edition
// is a site setting, see juris.js).
DI.HAZ = {
  LH: { name: 'Light Hazard', dens: 0.10, area: 1500, hose: 100, dur: 30, alpha: 0.0029, cap: 1500 },
  OH1: { name: 'Ordinary Hazard Group 1', dens: 0.15, area: 1500, hose: 250, dur: 60, alpha: 0.0117, cap: 4000 },
  OH2: { name: 'Ordinary Hazard Group 2', dens: 0.20, area: 1500, hose: 250, dur: 60, alpha: 0.0117, cap: 6000 },
  EH1: { name: 'Extra Hazard Group 1', dens: 0.30, area: 2500, hose: 500, dur: 90, alpha: 0.0469, cap: 12000 },
};

// Room types. val = $ of contents per tile, wetDmg = fraction of val ruined when soaked,
// smokeDmg = sensitivity to smoke, cond = conditioned (heated) space, spotRelease = one listed spot
// smoke detector in alarm is the detection leg of a preaction release (support rooms only; white space
// needs aspirating detection, and the battery room stays alarm-only until the Li-ion cycle).
DI.ROOMS = {
  office: { name: 'Office / Admin', haz: 'LH', val: 6e3, wetDmg: 0.25, smokeDmg: 0.1, cond: true, col: '#263445', ceil: 10 },
  hall: { name: 'Data Hall', haz: 'OH1', val: 9e5, wetDmg: 0.8, smokeDmg: 1.0, cond: true, col: '#1d2f3a', ceil: 16 },
  elec: { name: 'Electrical / UPS Room', haz: 'OH1', val: 4e5, wetDmg: 0.9, smokeDmg: 0.6, cond: true, col: '#2f2a3d', ceil: 14, spotRelease: true },
  batt: { name: 'Battery Room', haz: 'OH2', val: 3e5, wetDmg: 0.5, smokeDmg: 0.5, cond: true, col: '#3a2a2f', ceil: 14 },
  dock: { name: 'Loading Dock', haz: 'OH2', val: 1.5e4, wetDmg: 0.1, smokeDmg: 0.05, cond: false, col: '#2e3328', ceil: 18 },
  stor: { name: 'Storage / Staging', haz: 'OH2', val: 3e4, wetDmg: 0.3, smokeDmg: 0.1, cond: true, col: '#33301f', ceil: 16 },
  riser: { name: 'Riser Room', haz: 'OH1', val: 2e3, wetDmg: 0.02, smokeDmg: 0.02, cond: true, col: '#22303a', ceil: 12 },
  pump: { name: 'Fire Pump House', haz: 'OH1', val: 4e3, wetDmg: 0.02, smokeDmg: 0.02, cond: true, col: '#242f2c', ceil: 14 },
  corr: { name: 'Valve Gallery', haz: 'OH1', val: 2e3, wetDmg: 0.02, smokeDmg: 0.02, cond: true, col: '#1b2631', ceil: 12 },
  gen: { name: 'Generator Yard', haz: 'EH1', val: 8e4, wetDmg: 0.05, smokeDmg: 0.02, cond: false, col: '#30291f', ceil: 20, open: true },
};

</script>
<script>
// Jurisdiction / enforced edition table. The US edition of NFPA 13 is a site setting (W.cfg.edition).
// The edition changes citations and the delta note only; pass/fail does not differ.
// Section numbers are the ones held in the DC FP training. Do not add others without verifying them.
var DI = globalThis.DI || (globalThis.DI = {});

// World: the tile map the player builds on. Pure data + edit operations (no sim, no DOM).

// release mode is dropped and missing setpoints come from the el-el maker preset (the old 20 psi

DI.migratePart = function (p) {

    if (q.loAir === undefined || q.hiAir === undefined || q.pTrip === undefined) { DI.loadTrim(p, 'el-el'); q.repress = true; }
    if (!DI.TRIMS[q.trim]) q.trim = 'el-el';

    if (q.mech === undefined) q.mech = false;
    if (q.solOut === undefined) q.solOut = false;
    if (q.mrzL === undefined) q.mrzL = false;
  } else if (p.type === 'comp' || p.type === 'n2') {
    if (q.fault === undefined) q.fault = false;
    if (p.type === 'comp' && !(q.cutOut >= 0)) q.cutOut = 0;          // compressor cut-out: none
  } else if (p.type === 'panel') {

  } else if (p.type === 'dryv') {

};

DI.World = class {
  constructor(w, h) {
    this.w = w; this.h = h;
    const n = w * h;
    this.rooms = [];
    this.roomAt = new Int16Array(n);      // room index + 1
    this.pd = new Int8Array(n);           // pipe size index + 1 (0 = no pipe)
    this.pk = new Uint8Array(n);          // 0 main, 1 branch E-W, 2 branch N-S
    this.spk = new Uint8Array(n);         // 0 none, 1 sprinkler, 2 fused (open), 3 broken (open)
    this.air = new Uint8Array(n);         // air / nitrogen tubing layer
    this.cut = new Uint8Array(n * 2);     // capped joints: [k*2] = east edge of tile k, [k*2+1] = south edge
    this.partAt = new Int32Array(n);      // part id (0 = none)
    this.parts = new Map();
    this.wires = [];                      // [panelId, deviceId]
    this.nextId = 1;
    this.ver = 1;                         // bump on any topology change
    this.money = 0;
    this.outTemp = 70;                    // outdoor temperature, F
    this.power = true;                    // utility power
    // site / project settings: edition, ed72, nfpa76Adopted, pipeCut, detThr, spotThr, asdModel, sigClass, fitPct, trimGal,
    // insurer, manualReleaseBypassP, commPath, acDelayMin and the two hook elections of cause.js. Read them through
    // the DI helpers, which supply the defaults. (An old save may still carry the retired NFPA 76 stage key: nothing reads it.)
    this.cfg = {};

  k(x, y) { return y * this.w + x; }
  inb(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  room(x, y) { const r = this.roomAt[this.k(x, y)]; return r ? this.rooms[r - 1] : null; }
  addRoom(type, x, y, w, h, name) {
    const r = { id: this.rooms.length + 1, type, x, y, w, h, name: name || DI.ROOMS[type].name, temp: 70 };
    this.rooms.push(r);
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.roomAt[this.k(i, j)] = r.id;
    return r;
  }
  part(id) { return this.parts.get(id); }
  at(x, y) { return this.inb(x, y) ? this.parts.get(this.partAt[this.k(x, y)]) : undefined; }

  ports(p) {
    const t = DI.PARTS[p.type].ports;

    if (t === 'o') return { i: -1, o: (1 + p.rot) % 4 };
    if (t === 'i') return { i: (3 + p.rot) % 4, o: -1 };

  }

  offers(x, y, dir) {
    if (!this.inb(x, y)) return false;
    const k = this.k(x, y);
    if (this.pd[k]) { const b = this.pk[k]; return b === 0 || (b === 1 ? (dir & 1) === 1 : (dir & 1) === 0); }
    const p = this.parts.get(this.partAt[k]);
    if (!p) return false;

  }
  // Two tiles join when each offers a connection to the other. Branch lines stay inside their own
  // room: only mains (and parts) pass through a wall, so neighbouring systems never join by accident.
  linked(x, y, dir) {
    const nx = x + DI.DX[dir], ny = y + DI.DY[dir];
    if (!this.offers(x, y, dir) || !this.offers(nx, ny, DI.OPP[dir])) return false;
    const a = this.k(x, y), b = this.k(nx, ny);
    if (this.cut[dir === 1 ? a * 2 : dir === 2 ? a * 2 + 1 : dir === 3 ? b * 2 : b * 2 + 1]) return false;
    return !((this.pk[a] || this.pk[b]) && this.roomAt[a] !== this.roomAt[b]);

  canBuild(x, y) { return this.inb(x, y) && !this.partAt[this.k(x, y)]; }
  setPipe(x, y, size, kind, spk) {
    if (!this.canBuild(x, y)) return false;
    const k = this.k(x, y);

  }
  // cap (or uncap) the joint on the east (south = true: south) side of tile x,y

  setAir(x, y, on) { if (!this.inb(x, y)) return false; this.air[this.k(x, y)] = on ? 1 : 0; this.ver++; return true; }
  addPart(type, x, y, rot, props) {
    if (!this.inb(x, y)) return null;
    const k = this.k(x, y);
    if (this.partAt[k] || this.pd[k]) return null;
    const p = { id: this.nextId++, type, x, y, rot: rot || 0, p: Object.assign({}, DI.PARTS[type].props, props || {}) };
    if (type === 'panel') p.p.chan = (props && Array.isArray(props.chan) ? props.chan : [1, 1]).slice();      // its own array, not the catalogue's
    if (type === 'dpump') p.p.fuel = 1;
    this.parts.set(p.id, p); this.partAt[k] = p.id; this.ver++;

  }
  removePart(id) {
    const p = this.parts.get(id); if (!p) return;
    this.partAt[this.k(p.x, p.y)] = 0; this.parts.delete(id);
    this.wires = this.wires.filter((w) => w[0] !== id && w[1] !== id);

  }
  erasePipe(x, y) {
    const k = this.k(x, y); if (!this.pd[k]) return false;
    this.pd[k] = 0; this.pk[k] = 0; this.spk[k] = 0; this.cut[k * 2] = 0; this.cut[k * 2 + 1] = 0; this.ver++; return true;
  }
  // cost of whatever pipe is on a tile (for refunds)
  pipeCost(x, y) {
    const k = this.k(x, y); if (!this.pd[k]) return 0;

  }
  wire(a, b) {
    const pa = this.parts.get(a), pb = this.parts.get(b);

    let panel = pa.type === 'panel' ? a : pb.type === 'panel' ? b : 0;
    if (!panel) return false;
    const dev = panel === a ? b : a;
    if (this.parts.get(dev).type === 'panel') return false;

  }

    const W = new DI.World(j.w, j.h);

    W.wires = j.wires || []; W.nextId = j.nextId; W.money = j.money; W.outTemp = j.outTemp === undefined ? 70 : j.outTemp;

<script>
// Hydraulic network solver: Todini's Global Gradient Algorithm (the method EPANET uses),
// extended with a node capacitance term so trapped pressure, pump cycling and dry-system
// filling are all the same equation:
//     sum(Q in) - sum(Q out) = 60*C/dt * (P - Pprev)        [gpm; C in gal/psi]
// Link head loss a->b:  h(Q) = r*Q|Q|^0.85 + m*Q|Q| - pumpGain(Q)   [psi]
//   r = Hazen-Williams term, m = minor/orifice term (an open sprinkler is m = 1/K^2 to atmosphere).
var DI = globalThis.DI || (globalThis.DI = {});

DI.Net = class {
  constructor() { this.n = 0; this.cap = []; this.pPrev = []; this.fix = []; this.dem = []; this.links = []; this.P = null; }
  node(pPrev, cap, fixed) {
    this.cap.push(cap || 0); this.pPrev.push(pPrev || 0); this.fix.push(fixed === undefined ? NaN : fixed); this.dem.push(0);
    return this.n++;
  }
  link(a, b, o) {
    const l = { a, b, r: 0, m: 0, chk: false, pump: null, open: true, q: 0, tag: null };
    Object.assign(l, o); this.links.push(l); return l;
  }
};

DI.linkLoss = function (l, q, out) {      // out[0] = h, out[1] = dh/dq
  const aq = Math.abs(q);
  let h = l.r * q * Math.pow(aq, 0.85) + l.m * q * aq;
  let g = 1.85 * l.r * Math.pow(aq, 0.85) + 2 * l.m * aq;
  const pm = l.pump;
  if (pm && pm.spd > 0.02) {
    const s = pm.spd, qs = pm.gpm * s, x = Math.max(q, 0) / qs, e = DI.PUMP_EXP;
    h -= pm.psi * s * s * (1.2 - 0.2 * Math.pow(x, e));
    g += pm.psi * s * s * 0.2 * e * Math.pow(x, e - 1) / qs;
  }
  out[0] = h; out[1] = g < 1e-5 ? 1e-5 : g;
};

DI.solve = function (net, dt, maxIter) {
  const n = net.n, L = net.links, nl = L.length;
  const row = new Int32Array(n); let nf = 0;
  for (let i = 0; i < n; i++) row[i] = isNaN(net.fix[i]) ? nf++ : -1;
  const P = net.P && net.P.length === n ? net.P : (net.P = new Float64Array(n));
  for (let i = 0; i < n; i++) P[i] = row[i] < 0 ? net.fix[i] : net.pPrev[i];
  const cc = 60 / (dt > 0 && isFinite(dt) ? dt : 1e12);
  const A = new Float64Array(nf * nf), F = new Float64Array(nf), o = [0, 0];
  const lp = new Float64Array(nl), ly = new Float64Array(nl);
  let it = 0, ok = false;
  maxIter = maxIter || 40;
  for (; it < maxIter; it++) {
    A.fill(0);
    for (let i = 0; i < n; i++) {
      const r = row[i]; if (r < 0) continue;
      const c = net.cap[i] * cc + 1e-9;

<script>
// System discovery: what does each riser (wet / dry / preaction valve) actually feed?
// Flood-fills downstream of every system valve and records volume, sprinkler count, rooms,

// Also resolves the air / nitrogen tubing layer: which gas sources feed which valve.
var DI = globalThis.DI || (globalThis.DI = {});

DI.SYSV = { wetv: 1, dryv: 1, prev: 1 };

DI.findSystems = function (W) {
  const n = W.w * W.h, DX = DI.DX, DY = DI.DY;

  for (const v of W.parts.values()) {

    const s = { id: v.id, type: v.type, vol: 0, nSpk: 0, tiles: [], rooms: new Set(), remote: -1, remDist: -1, gridded: false,
      bypass: false, fed: false, src: [], hasN2: false, hasAir: false, area: 0, thru: new Set() };
    info.set(v.id, s);

    const o = W.ports(v).o;

    if (!W.linked(v.x, v.y, o)) continue;
    const q = [[v.x + DX[o], v.y + DY[o], kv, 1, 0]];

        const t = DI.PARTS[p.type];

DI.zoneVolume = (W, inf) => inf.vol * (1 + DI.cfgNum(W, 'fitPct') / 100) + DI.cfgNum(W, 'trimGal');

//            Double interlock needs it above 500 gal and a QOD does not extend that. Wet: nothing.
//   FM:      30 s at any volume for dry and double interlock, only when the site insurer is FM (NEEDS PE REVIEW).

DI.deliveryLimits = function (S, id, measured) {

<script>
// Graph builder: turns the tile map into a small hydraulic network for the solver.
// Raw graph = one node per pipe tile / part port. Then: dead ends with no outlet are pruned into
// their parent (their volume becomes capacitance) and runs of pipe are merged into single links.
// Dry (untripped) systems hold gas, not water, so their tiles are left out entirely.
var DI = globalThis.DI || (globalThis.DI = {});

DI.FIT = 1.3;                 // equivalent-length multiplier for fittings
DI.CAPW = 3e-5;               // gal/psi of "give" per gallon of water-filled pipe (trapped air pockets)

DI.buildGraph = function (W, S) {
  const n = W.w * W.h, DX = DI.DX, DY = DI.DY, OPP = DI.OPP, sd = S.sysd, ts = sd.tileSys;
  const net = new DI.Net(), atm = net.node(0, 0, 0);

    eL: new Int32Array(n * 2), eS: new Int8Array(n * 2), emit: [], ver: W.ver };

      rCap[v] += rCap[u]; rep[u] = v;

  const nodeOf = new Int32Array(R).fill(-1);

  const done = new Uint8Array(eA.length);

  for (const [id, r] of pRaw) G.partNode.set(id, [r[0] >= 0 ? nodeOf[r[0]] : -1, r[1] >= 0 ? nodeOf[r[1]] : -1]);

      case 'bfp': if (a >= 0 && b >= 0) l = net.link(a, b, { m: 7e-6, chk: true }); break;

DI.fireInit = function (S) {

    grid(x0, y0, x1, y1, size, kind) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (!W.pd[W.k(x, y)] && !W.partAt[W.k(x, y)]) W.setPipe(x, y, size, kind, true); return b; },
    p(type, x, y, rot, props) { return W.addPart(type, x, y, rot || 0, props); },
    capCol(x, y0, y1) { for (let y = y0; y <= y1; y++) W.setCut(x, y, false, 1); return b; },
    capRow(y, x0, x1) { for (let x = x0; x <= x1; x++) W.setCut(x, y, true, 1); return b; },
    air(pts) { for (const [x, y] of pts) W.setAir(x, y, 1); return b; },

// Build a fresh world and sim for a scenario: the map, the budget, the site settings the contract fixes

// `cfg` adds settings on top, for tests and what-if runs.
DI.buildScenario = function (sc, cfg) {

  Object.assign(W.cfg, JSON.parse(JSON.stringify(sc.cfg || {})), JSON.parse(JSON.stringify(cfg || {})));

// live = the site transmits to the fire department outside drills (sandbox only). contract = site settings

DI.simFlags = function (S, sc) { S.live = !!sc.sandbox; S.contract = !sc.sandbox; };

  sysOf: (S, type) => { const o = []; for (const [id, inf] of S.sysd.info) { const r = [...inf.rooms].map((i) => S.W.rooms[i - 1].type); if (r.includes(type)) o.push(id); } return o; },

// Recovery score of the first incident of the running drill, as report lines for DI.lossJudge (informational).
// The recovery rating (DI.recoveryTier, 0 to 3 stars) reads the operator's own steps only. The air refill is

// The air-refill sentence of a recovery report (Fire Tutor wording; it never says FAIL). sec = the measured refill,

    'replace-head': 'From the spare cabinet. Allowed only with the water isolated, the air / N&#8322; supply isolated, and the pipe at about 0 psi with no water. The drain may stay open: &ldquo;close the drain, then replace the head&rdquo; is backward.',
